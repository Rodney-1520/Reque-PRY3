                                                <div className="flex justify-end gap-2 mt-3">
                                                    <button type="button" onClick={closeAddList} className={BTN_SECUNDARIO}>Cancelar</button>
                                                    <button type="submit" className={BTN_PRIMARIO}>Crear lista</button>
                                                </div>
                                            </form>
                                        )}
                                        {lists.length > 0 ? (
                                            <ul className="grid grid-cols-1 gap-2">
                                                {lists.map(list => (
                                                    <li key={list.id} className={`relative flex items-center gap-3 p-4 bg-surface border rounded-2xl ${ancha && selectedList?.id === list.id ? 'border-action ring-1 ring-action' : 'border-line hover:border-line-strong'}`}>
                                                        <div className="flex-1 min-w-0">
                                                            <h2 className="text-base font-bold text-ink [overflow-wrap:anywhere]">
                                                                <button type="button" data-list-open={list.id} onClick={() => openList(list.id)} className="text-left hover:text-link after:absolute after:inset-0 after:rounded-[inherit]">{list.nombre}</button>
                                                            </h2>
                                                            <p className="mt-0.5 text-sm text-muted">{plural(itemsDeLista(list).length, 'ítem', 'ítems')}</p>
                                                        </div>
                                                        <button type="button" onClick={() => handleDeleteList(list)} className={`${BTN_PELIGRO} relative z-10 w-10 !px-0`} aria-label={`Eliminar lista ${list.nombre}`}><Icon name="basura" className="w-4 h-4" /></button>
                                                        <Icon name="flechaDer" className="w-5 h-5 text-muted" />
                                                    </li>
                                                ))}
                                            </ul>
                                        ) : !showAddList && (
                                            <div className="border border-dashed border-line-strong rounded-2xl p-10 text-center text-sm text-muted">Todavía no hay listas.</div>
                                        )}
                                    </section>
                                )}

                                {selectedList && (
                                    <section aria-labelledby="list-title" className={ancha ? 'min-w-0 p-6 bg-surface border border-line rounded-2xl' : ''}>
                                        {!ancha && (
                                            <button type="button" onClick={closeList} className={`${ENLACE} mb-3`}><Icon name="flechaIzq" className="w-4 h-4" strokeWidth={2.2} /> Todas las listas</button>
                                        )}
                                        <h1 id="list-title" tabIndex={-1} className="text-2xl font-bold text-ink tracking-tight [overflow-wrap:anywhere] focus:outline-none">{selectedList.nombre}</h1>
                                        <form onSubmit={handleAddToList} noValidate className="mt-5 mb-6">
                                            <label htmlFor="list-add" className={ETIQUETA}>Agregar herramienta o material</label>
                                            {disponibles.length > 0 ? (
                                                <div className="flex flex-col sm:flex-row gap-3">
                                                    <select id="list-add" value={itemToAddId} onChange={(e) => { setItemToAddId(e.target.value); setAddError(''); }} aria-invalid={!!addError} aria-describedby={addError ? 'list-add-err' : undefined} className={`${CAMPO} ${borde(addError)} flex-1`}>
                                                        <option value="">Elige del inventario…</option>
                                                        {disponibles.map(inv => <option key={inv.id} value={inv.id}>{inv.nombre} · {inv.categoria.toLowerCase()}</option>)}
                                                    </select>
                                                    <button type="submit" className={BTN_PRIMARIO}>Agregar</button>
                                                </div>
                                            ) : (
                                                <p className="text-sm text-muted">{inventory.length === 0 ? 'El inventario está vacío.' : 'Ya están todos los ítems del inventario en esta lista.'}</p>
                                            )}
                                            <FieldError id="list-add-err">{addError}</FieldError>
                                        </form>
                                        {itemsDeLista(selectedList).length > 0 ? (
                                            <div className="relative overflow-x-auto bg-surface border border-line rounded-2xl">
                                                <table className="w-full text-left border-collapse">
                                                    <caption className="sr-only">Ítems de la lista {selectedList.nombre}</caption>
                                                    <thead>
                                                        <tr className="text-sm text-muted border-b border-line">
                                                            <th scope="col" className="px-4 py-3 font-semibold">Herramienta o material</th>
                                                            <th scope="col" className="hidden sm:table-cell px-4 py-3 font-semibold">Tipo</th>
                                                            <th scope="col" className="hidden sm:table-cell px-4 py-3 font-semibold">Ubicación</th>
                                                            <th scope="col" className="px-2 sm:px-4 py-3"><span className="sr-only">Acciones</span></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-line text-sm text-ink-soft">
                                                        {itemsDeLista(selectedList).map(item => (
                                                            <tr key={item.id}>
                                                                <th scope="row" className="px-4 py-3 font-semibold text-ink [overflow-wrap:anywhere]">{item.nombre}</th>
                                                                <td className="hidden sm:table-cell px-4 py-3">{item.categoria}</td>
                                                                <td className="hidden sm:table-cell px-4 py-3 font-mono text-xs">{item.ubicacion}</td>
                                                                <td className="px-2 sm:px-4 py-3 text-right">
                                                                    <button type="button" onClick={() => handleRemoveFromList(item)} aria-label={`Quitar ${item.nombre} de la lista`} className={`${BTN_PELIGRO} max-sm:w-10 max-sm:px-0`}><Icon name="x" className="w-4 h-4" strokeWidth={2.2} /><span className="hidden sm:inline">Quitar</span></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        ) : (
                                            <p className="text-sm text-muted">Esta lista todavía no tiene ítems.</p>
                                        )}
                                    </section>
                                )}
                            </div>
                        )}

                        {/* ---------- PROYECTOS (RF-29 al RF-43, RF-46 al RF-49) ---------- */}
                        {activeModule === 'proyectos' && (() => {
                            const finalizados = projects.filter(p => p.estado === 'Finalizado');
                            const conTiempo = finalizados.filter(p => p.inicio && p.fin);
                            const promedio = conTiempo.length ? conTiempo.reduce((t, p) => t + (new Date(p.fin) - new Date(p.inicio)), 0) / conTiempo.length : null;
                            const masRealizados = Object.values(finalizados.reduce((acc, p) => {
                                const k = normalizar(p.nombre);
                                acc[k] = acc[k] || { nombre: p.nombre, veces: 0 };
                                acc[k].veces++;
                                return acc;
                            }, {})).sort((a, b) => b.veces - a.veces);
                            const listaEnCurso = enCursoActual ? lists.find(l => l.id === enCursoActual.listId) || null : null;
                            const itemsEnCurso = itemsDeLista(listaEnCurso);
                            const verificadosEnCurso = enCursoActual ? itemsEnCurso.filter(i => (enCursoActual.verificados || []).includes(i.id)).length : 0;
                            const progreso = itemsEnCurso.length ? Math.round(verificadosEnCurso / itemsEnCurso.length * 100) : 0;

                            const panelEnCurso = (
                                <section aria-labelledby="en-curso-title" className="p-6 bg-surface border border-line rounded-2xl">
                                    <p className="text-xs font-bold uppercase tracking-wider text-muted">Proyecto en curso</p>
                                    {!enCursoActual ? (
                                        <p id="en-curso-title" className="mt-2 text-sm text-muted">No hay ningún proyecto en curso.</p>
                                    ) : (
                                        <>
                                            <h2 id="en-curso-title" className="mt-1 text-xl font-bold text-ink tracking-tight [overflow-wrap:anywhere]">{enCursoActual.nombre}</h2>
                                            <p className="mt-1 text-sm text-muted">{enCursoActual.descripcion}</p>
                                            {!listaEnCurso ? (
                                                <p className="mt-4 text-sm text-muted">Este proyecto no tiene una lista de materiales asociada.</p>
                                            ) : (
                                                <>
                                                    <div className="mt-4">
                                                        <div className="flex items-center justify-between text-sm">
                                                            <span className="font-semibold text-ink">Progreso: {verificadosEnCurso} de {itemsEnCurso.length} ítems verificados</span>
                                                            <span className="font-mono font-bold text-ink">{progreso}%</span>
                                                        </div>
                                                        <div className="mt-1.5 h-2.5 rounded-full bg-canvas border border-line overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={progreso} aria-label="Progreso del proyecto en curso">
                                                            <div className="h-full bg-action rounded-full transition-[width] duration-300" style={{ width: `${progreso}%` }} />
                                                        </div>
                                                    </div>
                                                    <h3 className="mt-5 mb-2 text-base font-bold text-ink">Lista: {listaEnCurso.nombre}</h3>
                                                    {itemsEnCurso.length === 0 ? (
                                                        <p className="text-sm text-muted">La lista no tiene ítems.</p>
                                                    ) : (
                                                        <ul className="divide-y divide-line border-y border-line">
                                                            {itemsEnCurso.map(item => {
                                                                const ok = (enCursoActual.verificados || []).includes(item.id);
                                                                return (
                                                                    <li key={item.id}>
                                                                        <label className="flex items-center gap-3 min-h-[2.75rem] text-sm text-ink cursor-pointer">
                                                                            <input type="checkbox" checked={ok} onChange={() => toggleVerificado(enCursoActual, item)} className="w-4 h-4 shrink-0 accent-[var(--action)]" />
                                                                            <span className={`flex-1 ${ok ? 'line-through text-muted' : ''}`}>{item.nombre}</span>
                                                                            <span className="font-mono text-xs text-muted">{item.ubicacion}</span>
                                                                        </label>
                                                                    </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    )}
                                                </>
                                            )}
                                        </>
                                    )}
                                </section>
                            );

                            const panelEstadisticas = (
                                <section aria-labelledby="stats-title" className="p-6 bg-surface border border-line rounded-2xl">
                                    <h2 id="stats-title" className="text-base font-bold text-ink">Estadísticas de proyectos</h2>
                                    <dl className="mt-3 grid grid-cols-3 gap-3">
                                        {ESTADOS.map(e => (
                                            <div key={e} className="rounded-xl bg-canvas border border-line px-3 py-2.5">
                                                <dt className="text-xs font-semibold text-muted">{e === 'Finalizado' ? 'Finalizados' : e === 'Pendiente' ? 'Pendientes' : 'En curso'}</dt>
                                                <dd className="font-mono text-xl font-bold text-ink">{projects.filter(p => p.estado === e).length}</dd>
                                            </div>
                                        ))}
                                    </dl>
                                    <p className="mt-3 text-sm text-ink-soft">Tiempo promedio de ejecución: <b className="text-ink">{promedio === null ? 'sin proyectos finalizados' : duracion(promedio)}</b></p>
                                    <h3 className="mt-5 text-sm font-bold text-ink">Proyectos más realizados</h3>
                                    {masRealizados.length === 0 ? (
                                        <p className="mt-1 text-sm text-muted">Todavía no hay proyectos finalizados.</p>
                                    ) : (
                                        <ol className="mt-1 list-decimal pl-5 text-sm text-ink-soft space-y-0.5">
                                            {masRealizados.map(m => <li key={m.nombre}>{m.nombre}: <b className="text-ink">{plural(m.veces, 'vez', 'veces')}</b></li>)}
                                        </ol>
                                    )}
                                </section>
                            );

                            return (
                                <section aria-labelledby="proj-title">
                                    <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                        <div>
                                            <h1 id="proj-title" tabIndex={-1} className="focus:outline-none text-2xl font-bold text-ink tracking-tight">Proyectos</h1>
                                            <p className="mt-1 text-sm text-muted">{plural(projects.length, 'proyecto registrado', 'proyectos registrados')}.</p>
                                        </div>
                                        {!showAddProject && (
                                            <button id="btn-add-project" type="button" onClick={() => setShowAddProject(true)} className={BTN_PRIMARIO}><Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Nuevo proyecto</button>
                                        )}
                                    </div>

                                    {showAddProject && (
                                        <form onSubmit={handleCreateProject} noValidate onKeyDown={(e) => e.key === 'Escape' && closeAddProject()} className="panel-enter mb-6 p-4 sm:p-5 bg-surface border border-line-strong rounded-2xl">
                                            <h2 className="text-base font-bold text-ink mb-3">Crear proyecto</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 items-start">
                                                <div>
                                                    <label htmlFor="proj-name" className={ETIQUETA}>Nombre</label>
                                                    <input id="proj-name" type="text" autoFocus maxLength={70} value={newProj.nombre} onChange={(e) => { setNewProj({ ...newProj, nombre: e.target.value }); setProjErrors({ ...projErrors, nombre: '' }); }} aria-invalid={!!projErrors.nombre} className={`${CAMPO} ${borde(projErrors.nombre)}`} />
                                                    <FieldError id="proj-name-err">{projErrors.nombre}</FieldError>
                                                </div>
                                                <div>
                                                    <label htmlFor="proj-state" className={ETIQUETA}>Estado inicial</label>
                                                    <select id="proj-state" value={newProj.estado} onChange={(e) => { setNewProj({ ...newProj, estado: e.target.value }); setProjErrors({ ...projErrors, estado: '' }); }} aria-invalid={!!projErrors.estado} className={`${CAMPO} ${borde(projErrors.estado)}`}>
                                                        {ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
                                                    </select>
                                                    <FieldError id="proj-state-err">{projErrors.estado}</FieldError>
                                                </div>
                                                <div>
                                                    <label htmlFor="proj-list" className={ETIQUETA}>Lista de materiales</label>
                                                    <select id="proj-list" value={newProj.listId} onChange={(e) => setNewProj({ ...newProj, listId: e.target.value })} className={`${CAMPO} ${borde(false)}`}>
                                                        <option value="">Sin lista</option>
                                                        {listasLibres(null).map(l => <option key={l.id} value={l.id}>{l.nombre}</option>)}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="mt-3">
                                                <label htmlFor="proj-desc" className={ETIQUETA}>Descripción</label>
                                                <input id="proj-desc" type="text" maxLength={160} value={newProj.descripcion} onChange={(e) => { setNewProj({ ...newProj, descripcion: e.target.value }); setProjErrors({ ...projErrors, descripcion: '' }); }} aria-invalid={!!projErrors.descripcion} className={`${CAMPO} ${borde(projErrors.descripcion)}`} />
                                                <FieldError id="proj-desc-err">{projErrors.descripcion}</FieldError>
                                            </div>
                                            <div className="flex justify-end gap-2 mt-4">
                                                <button type="button" onClick={closeAddProject} className={BTN_SECUNDARIO}>Cancelar</button>
                                                <button type="submit" className={BTN_PRIMARIO}>Guardar proyecto</button>
                                            </div>
                                        </form>
                                    )}

                                    <div className={ancha ? 'grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)] gap-6 items-start' : 'space-y-6'}>
                                        {!ancha && panelEnCurso}
                                        {projects.length > 0 ? (
                                            <ul className="grid grid-cols-1 gap-3">
                                                {projects.map(proj => {
                                                    const hist = proj.historial || [];
                                                    return (
                                                        <li key={proj.id} className={`bg-surface border rounded-2xl p-4 sm:p-5 ${proj.estado === 'En curso' ? 'border-action ring-1 ring-action' : 'border-line'}`}>
                                                            <div className="flex flex-wrap items-start justify-between gap-3">
                                                                <div className="min-w-0 flex-1">
                                                                    <div className="flex flex-wrap items-center gap-2">
                                                                        <h2 className="text-lg font-bold text-ink [overflow-wrap:anywhere]">{proj.nombre}</h2>
                                                                        <EstadoBadge estado={proj.estado} />
                                                                    </div>
                                                                    <p className="mt-1 text-sm text-muted">{proj.descripcion}</p>
                                                                </div>
                                                                <button type="button" onClick={() => handleDeleteProject(proj)} aria-label={`Eliminar proyecto ${proj.nombre}`} className={`${BTN_PELIGRO} max-sm:w-10 max-sm:px-0`}><Icon name="basura" className="w-4 h-4" /><span className="hidden sm:inline">Eliminar</span></button>
                                                            </div>

                                                            {editProj && editProj.id === proj.id && (
                                                                <form onSubmit={saveProj} noValidate onKeyDown={(e) => e.key === 'Escape' && setEditProj(null)} className="panel-enter mt-3 p-3 bg-canvas border border-line-strong rounded-xl space-y-2">
                                                                    <label htmlFor="ep-n" className={ETIQUETA}>Nombre</label>
                                                                    <input id="ep-n" autoFocus maxLength={70} value={editProj.nombre} onChange={(e) => setEditProj({ ...editProj, nombre: e.target.value, error: '' })} className={`${CAMPO} ${borde(editProj.error)}`} />
                                                                    <label htmlFor="ep-d" className={ETIQUETA}>Descripción</label>
                                                                    <input id="ep-d" maxLength={160} value={editProj.descripcion} onChange={(e) => setEditProj({ ...editProj, descripcion: e.target.value, error: '' })} className={`${CAMPO} ${borde(editProj.error)}`} />
                                                                    <FieldError id="ep-err">{editProj.error}</FieldError>
                                                                    <div className="flex justify-end gap-2"><button type="button" onClick={() => setEditProj(null)} className={BTN_SECUNDARIO}>Cancelar</button><button type="submit" className={BTN_PRIMARIO}>Guardar cambios</button></div>
                                                                </form>
                                                            )}

                                                            <div className="mt-4 pt-4 border-t border-line grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                                <div>
                                                                    <label htmlFor={`proj-state-${proj.id}`} className="block text-xs font-semibold text-muted mb-1">Estado</label>
                                                                    <select id={`proj-state-${proj.id}`} value={proj.estado} onChange={(e) => handleUpdateProjectState(proj, e.target.value)} className={`${CAMPO} ${borde(false)}`}>
                                                                        {ESTADOS.map(e => <option key={e} value={e}>{e}</option>)}
                                                                    </select>
                                                                </div>
                                                                <div>
                                                                    <label htmlFor={`proj-lista-${proj.id}`} className="block text-xs font-semibold text-muted mb-1">Lista de materiales</label>
                                                                    <select id={`proj-lista-${proj.id}`} value={proj.listId ?? ''} onChange={(e) => setListaProyecto(proj, e.target.value)} className={`${CAMPO} ${borde(false)}`}>
                                                                        <option value="">Sin lista</option>
                                                                        {lists.filter(l => l.id === proj.listId || proj.estado === 'Finalizado' || !listaOcupada(l.id, proj.id)).map(l => <option key={l.id} value={l.id}>{l.nombre}</option>)}
                                                                    </select>
                                                                </div>
                                                            </div>
                                                            <div className="mt-3 flex flex-wrap items-center gap-2">
                                                                <button type="button" onClick={() => setEditProj({ id: proj.id, nombre: proj.nombre, descripcion: proj.descripcion, error: '' })} className={`${BTN_SECUNDARIO} px-3`}><Icon name="lapiz" className="w-4 h-4" /> Editar</button>
                                                                <button type="button" onClick={() => duplicarProyecto(proj)} className={`${BTN_SECUNDARIO} px-3`}>Duplicar</button>
                                                            </div>
                                                            <details className="mt-3">
                                                                <summary className="text-sm font-semibold text-link cursor-pointer">Historial de cambios ({hist.length})</summary>
                                                                <ul className="mt-2 space-y-1 text-sm text-ink-soft max-h-48 overflow-y-auto">
                                                                    {hist.length === 0 ? <li className="text-muted">Todavía no hay cambios registrados.</li> : hist.map((h, i) => <li key={i}><span className="font-mono text-xs text-muted">{h.fecha}</span> · {h.texto}</li>)}
                                                                </ul>
                                                            </details>
                                                        </li>
                                                    );
                                                })}
                                            </ul>
                                        ) : (
                                            <div className="border border-dashed border-line-strong rounded-2xl p-10 text-center text-sm text-muted">Todavía no hay proyectos.</div>
                                        )}
                                        {ancha ? (
                                            <div className="space-y-6 sticky top-24">{panelEnCurso}{panelEstadisticas}</div>
                                        ) : panelEstadisticas}
                                    </div>
                                </section>
                            );
                        })()}
                    </main>
                    <footer className="max-w-[100rem] w-full mx-auto px-4 sm:px-6 py-5 border-t border-line text-xs text-muted">
                        ¿Hay materiales? · Sistema de inventario, listas y proyectos del taller
                    </footer>
                    {toastEl}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
