                                                                    <EditorCantidad id={`need-${f.id}`} label={`Cuánto necesitas de ${f.nombre}`} min="1" value={editingNeed.value} error={editingNeed.error} onChange={(e) => setEditingNeed({ ...editingNeed, value: e.target.value, error: '' })} onSubmit={saveNeed} onCancel={cancelNeed} />
                                                                ) : (
                                                                    <button type="button" data-need={f.id} onClick={() => setEditingNeed({ id: f.id, value: String(f.necesito), error: '' })} aria-label={`Cambiar cuánto necesitas de ${f.nombre}: ${f.necesito}`} className="inline-flex items-center gap-1.5 font-mono font-bold text-ink min-h-[2.5rem] px-2 -mr-2 rounded-lg hover:bg-action-soft hover:text-link">
                                                                        {fmt(f.necesito)}
                                                                        <Icon name="lapiz" className="w-3.5 h-3.5 text-muted" />
                                                                    </button>
                                                                )}
                                                            </td>
                                                            <td className="px-2 sm:px-4 py-3 text-right font-mono font-semibold text-ink">{fmt(f.cantidad)}</td>
                                                            <td className="hidden sm:table-cell px-4 py-3">
                                                                {f.falta > 0 ? (
                                                                    <div className="flex flex-wrap items-center gap-2">
                                                                        <Badge cls="bg-err-soft text-err-strong" icon="alerta">Faltan {fmt(f.falta)}</Badge>
                                                                        <button type="button" onClick={() => jumpToInventoryItem(f)} className="text-xs font-semibold text-link hover:text-link-hover underline underline-offset-4">Ajustar en bodega →</button>
                                                                    </div>
                                                                ) : (
                                                                    <Badge cls="bg-ok-soft text-ok" icon="check">Alcanza</Badge>
                                                                )}
                                                            </td>
                                                            <td className="px-2 sm:px-4 py-3 text-right">
                                                                <button type="button" data-quitar={f.id} onClick={() => handleRemoveFromList(f)} aria-label={`Quitar ${f.nombre} de la lista`} className={`${BTN_PELIGRO} max-sm:w-10 max-sm:px-0`}><Icon name="x" className="w-4 h-4" strokeWidth={2.2} /><span className="hidden sm:inline">Quitar</span></button>
                                                            </td>
                                                        </tr>
                                                        {editingNeed && editingNeed.id === f.id && angosta && (
                                                            <tr className="bg-canvas">
                                                                <td colSpan="5" className="px-4 pb-4 pt-1">
                                                                    <EditorCantidad apilado id={`need-${f.id}`} label={`Cuánto necesitas de ${f.nombre}`} min="1" value={editingNeed.value} error={editingNeed.error} onChange={(e) => setEditingNeed({ ...editingNeed, value: e.target.value, error: '' })} onSubmit={saveNeed} onCancel={cancelNeed} />
                                                                </td>
                                                            </tr>
                                                        )}
                                                        </React.Fragment>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                    {r.filas.length > 0 && (
                                        <p className="mt-3 text-sm text-muted">Toca una cantidad <Icon name="lapiz" className="inline w-3.5 h-3.5 -mt-0.5" /> para cambiar cuánto necesitas en este trabajo.</p>
                                    )}
                                </section>
                            );
                        })()}

                        {/* ---------- INVENTARIO (CU-04 al CU-13) ---------- */}
                        {activeModule === 'inventario' && (
                            <section aria-labelledby="inv-title">
                                <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                    <div>
                                        <h1 id="inv-title" tabIndex={-1} className="focus:outline-none text-2xl font-bold text-ink tracking-tight">Inventario</h1>
                                        <p className="mt-1 text-sm text-muted">
                                            {plural(inventory.length, 'ítem', 'ítems')} en bodega{conStockBajo > 0 && <> · <button type="button" onClick={() => setFilterCategory('Bajo')} className="font-semibold text-warn underline underline-offset-4 decoration-dotted">{fmt(conStockBajo)} con stock bajo o agotado</button></>}
                                        </p>
                                    </div>
                                    {!showAddItem && (
                                        <button id="btn-add-item" type="button" onClick={() => setShowAddItem(true)} className={BTN_PRIMARIO}>
                                            <Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Registrar ítem
                                        </button>
                                    )}
                                </div>

                                {showAddItem && (
                                    <form onSubmit={handleAddItem} noValidate onKeyDown={(e) => e.key === 'Escape' && closeAddItem()} className="panel-enter mb-6 p-4 sm:p-5 bg-surface border border-line-strong rounded-2xl">
                                        <h2 className="text-base font-bold text-ink mb-3">Registrar herramienta o material</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-[10rem_1fr_12rem_8rem] gap-3 items-start">
                                            <div>
                                                <label htmlFor="item-cat" className={ETIQUETA}>Categoría</label>
                                                <select id="item-cat" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} className={`${CAMPO} ${borde(false)}`}>
                                                    <option value="Herramienta">Herramienta</option>
                                                    <option value="Material">Material</option>
                                                </select>
                                            </div>
                                            <div className="min-w-0">
                                                <label htmlFor="item-name" className={ETIQUETA}>Nombre</label>
                                                <input id="item-name" ref={firstItemFieldRef} type="text" placeholder="Ej. Lija grano 80" value={newName} onChange={(e) => { setNewName(e.target.value); setItemErrors({ ...itemErrors, nombre: '' }); }} maxLength={80} aria-invalid={!!itemErrors.nombre} aria-describedby={itemErrors.nombre ? 'item-name-err' : undefined} className={`${CAMPO} ${borde(itemErrors.nombre)}`} />
                                                <FieldError id="item-name-err">{itemErrors.nombre}</FieldError>
                                            </div>
                                            <div>
                                                <label htmlFor="item-loc" className={ETIQUETA}>Ubicación</label>
                                                <input id="item-loc" type="text" placeholder="Ej. Estante A-1" value={newLocation} onChange={(e) => { setNewLocation(e.target.value); setItemErrors({ ...itemErrors, ubicacion: '' }); }} maxLength={40} aria-invalid={!!itemErrors.ubicacion} aria-describedby={itemErrors.ubicacion ? 'item-loc-err' : undefined} className={`${CAMPO} ${borde(itemErrors.ubicacion)}`} />
                                                <FieldError id="item-loc-err">{itemErrors.ubicacion}</FieldError>
                                            </div>
                                            <div>
                                                <label htmlFor="item-qty" className={ETIQUETA}>Cantidad</label>
                                                <input id="item-qty" type="number" inputMode="numeric" placeholder="0" min="0" max={CANTIDAD_MAX} step="1" onWheel={sinRueda} value={newQuantity} onChange={(e) => { setNewQuantity(e.target.value); setItemErrors({ ...itemErrors, cantidad: '' }); }} aria-invalid={!!itemErrors.cantidad} aria-describedby={itemErrors.cantidad ? 'item-qty-err' : undefined} className={`${CAMPO} ${borde(itemErrors.cantidad)}`} />
                                                <FieldError id="item-qty-err">{itemErrors.cantidad}</FieldError>
                                            </div>
                                        </div>
                                        <div className="flex justify-end gap-2 mt-4">
                                            <button type="button" onClick={closeAddItem} className={BTN_SECUNDARIO}>Cancelar</button>
                                            <button type="submit" className={BTN_PRIMARIO}>Guardar ítem</button>
                                        </div>
                                    </form>
                                )}

                                <div className="flex flex-col sm:flex-row gap-3 mb-4">
                                    <div className="relative flex-1 sm:max-w-sm">
                                        <label htmlFor="inv-search" className="sr-only">Buscar por nombre o ubicación</label>
                                        <span className="absolute left-3 inset-y-0 flex items-center text-muted pointer-events-none"><Icon name="buscar" className="w-4 h-4" /></span>
                                        <input
                                            id="inv-search"
                                            ref={searchRef}
                                            type="search"
                                            placeholder="Buscar por nombre o ubicación"
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            maxLength={80}
                                            aria-keyshortcuts="/"
                                            className={`${CAMPO} ${borde(false)} pl-9 pr-9`}
                                        />
                                        {searchTerm ? (
                                            <button type="button" onClick={() => { setSearchTerm(''); searchRef.current?.focus(); }} aria-label="Borrar búsqueda" className="absolute right-1 inset-y-0 my-auto w-9 h-9 rounded-lg flex items-center justify-center text-muted hover:text-ink hover:bg-canvas">
                                                <Icon name="x" className="w-4 h-4" strokeWidth={2} />
                                            </button>
                                        ) : (
                                            <kbd className="hidden md:flex absolute right-2.5 inset-y-0 my-auto h-6 items-center px-1.5 rounded border border-line-strong text-xs font-mono text-muted pointer-events-none" aria-hidden="true">/</kbd>
                                        )}
                                    </div>
                                    <div>
                                        <label htmlFor="inv-filter" className="sr-only">Filtrar</label>
                                        <select id="inv-filter" value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className={`${CAMPO} ${borde(false)} sm:w-auto`}>
                                            <option value="Todos">Todas las categorías</option>
                                            <option value="Herramienta">Solo herramientas</option>
                                            <option value="Material">Solo materiales</option>
                                            <option value="Bajo">Stock bajo o agotado</option>
                                        </select>
                                    </div>
                                </div>

                                {editingItem && (
                                    <form onSubmit={saveItemDetails} noValidate onKeyDown={(e) => e.key === 'Escape' && cancelEditItem()} className="panel-enter mb-4 p-4 sm:p-5 bg-surface border border-line-strong rounded-2xl">
                                        <h2 className="text-base font-bold text-ink mb-3">Editar datos del ítem</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-[10rem_1fr_12rem] gap-3 items-start">
                                            <div>
                                                <label htmlFor={`edit-cat-${editingItem.id}`} className={ETIQUETA}>Categoría</label>
                                                <select id={`edit-cat-${editingItem.id}`} value={editingItem.categoria} onChange={(e) => setEditingItem({ ...editingItem, categoria: e.target.value })} className={`${CAMPO} ${borde(false)}`}>
                                                    <option value="Herramienta">Herramienta</option>
                                                    <option value="Material">Material</option>
                                                </select>
                                            </div>
                                            <div className="min-w-0">
                                                <label htmlFor={`edit-name-${editingItem.id}`} className={ETIQUETA}>Nombre</label>
                                                <input id={`edit-name-${editingItem.id}`} type="text" autoFocus maxLength={80} value={editingItem.nombre} onChange={(e) => setEditingItem({ ...editingItem, nombre: e.target.value, errors: { ...editingItem.errors, nombre: '' } })} aria-invalid={!!editingItem.errors?.nombre} aria-describedby={editingItem.errors?.nombre ? `edit-name-err-${editingItem.id}` : undefined} className={`${CAMPO} ${borde(editingItem.errors?.nombre)}`} />
                                                <FieldError id={`edit-name-err-${editingItem.id}`}>{editingItem.errors?.nombre}</FieldError>
                                            </div>
                                            <div>
                                                <label htmlFor={`edit-loc-${editingItem.id}`} className={ETIQUETA}>Ubicación</label>
                                                <input id={`edit-loc-${editingItem.id}`} type="text" maxLength={40} value={editingItem.ubicacion} onChange={(e) => setEditingItem({ ...editingItem, ubicacion: e.target.value, errors: { ...editingItem.errors, ubicacion: '' } })} aria-invalid={!!editingItem.errors?.ubicacion} aria-describedby={editingItem.errors?.ubicacion ? `edit-loc-err-${editingItem.id}` : undefined} className={`${CAMPO} ${borde(editingItem.errors?.ubicacion)}`} />
                                                <FieldError id={`edit-loc-err-${editingItem.id}`}>{editingItem.errors?.ubicacion}</FieldError>
                                            </div>
                                        </div>
                                        <div className="flex justify-end gap-2 mt-4">
                                            <button type="button" onClick={cancelEditItem} className={BTN_SECUNDARIO}>Cancelar</button>
                                            <button type="submit" className={BTN_PRIMARIO}>Guardar cambios</button>
                                        </div>
                                    </form>
                                )}

                                <div className="relative overflow-x-auto bg-surface border border-line rounded-2xl">
                                    <table className="w-full text-left border-collapse">
                                        <caption className="sr-only">Inventario del taller: se muestran {filteredInventory.length} de {inventory.length} ítems</caption>
                                        <thead>
                                            <tr className="text-sm text-muted border-b border-line">
                                                <th scope="col" aria-sort={ariaSort('nombre')} className="pl-3 pr-2 sm:px-4 py-1.5">
                                                    <button type="button" onClick={() => toggleSort('nombre')} className={`inline-flex items-center gap-1 min-h-[2.5rem] font-semibold hover:text-ink ${sort.col === 'nombre' ? 'text-ink' : ''}`}>
                                                        Nombre
                                                        <Icon name={sort.col === 'nombre' ? (sort.dir === 'asc' ? 'ordenAsc' : 'ordenDesc') : 'orden'} className={`w-4 h-4 ${sort.col === 'nombre' ? 'text-link' : 'opacity-40'}`} strokeWidth={2.2} />
                                                    </button>
                                                </th>
                                                <th scope="col" className="hidden md:table-cell px-4 py-3 font-semibold">Categoría</th>
                                                <th scope="col" className="hidden sm:table-cell px-4 py-3 font-semibold">Ubicación</th>
                                                <th scope="col" aria-sort={ariaSort('cantidad')} className="px-2 sm:px-4 py-1.5 text-right">
                                                    <button type="button" onClick={() => toggleSort('cantidad')} className={`inline-flex items-center gap-1 min-h-[2.5rem] font-semibold hover:text-ink ${sort.col === 'cantidad' ? 'text-ink' : ''}`}>
                                                        <><span className="sm:hidden">Hay</span><span className="hidden sm:inline">En bodega</span></>
                                                        <Icon name={sort.col === 'cantidad' ? (sort.dir === 'asc' ? 'ordenAsc' : 'ordenDesc') : 'orden'} className={`w-4 h-4 ${sort.col === 'cantidad' ? 'text-link' : 'opacity-40'}`} strokeWidth={2.2} />
                                                    </button>
                                                </th>
                                                <th scope="col" className="hidden sm:table-cell px-2 sm:px-4 py-3 font-semibold">Estado</th>
                                                <th scope="col" className="px-2 sm:px-4 py-3"><span className="sr-only">Acciones</span></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-line text-sm text-ink-soft">
                                            {sortedInventory.length > 0 ? (
                                                sortedInventory.map(item => (
                                                    <React.Fragment key={item.id}>
                                                    <tr>
                                                        <th scope="row" className="pl-3 pr-2 sm:px-4 py-3 font-semibold text-ink min-w-[7rem] max-w-[18rem] [overflow-wrap:anywhere]">
                                                            {item.nombre}
                                                            <span className="sm:hidden block text-xs font-mono font-normal text-muted mt-0.5">{item.ubicacion}</span>
                                                            <span className="sm:hidden block mt-1.5"><StockBadge cantidad={item.cantidad} /></span>
                                                        </th>
                                                        <td className="hidden md:table-cell px-4 py-3 whitespace-nowrap">{item.categoria}</td>
                                                        <td className="hidden sm:table-cell px-4 py-3 min-w-[7rem] max-w-[12rem] font-mono text-xs text-ink-soft [overflow-wrap:anywhere]">{item.ubicacion}</td>
                                                        <td className="px-2 sm:px-4 py-3 text-right whitespace-nowrap">
                                                            {editing && editing.id === item.id && !angosta ? (
                                                                <EditorCantidad id={`qty-${item.id}`} label={`Cantidad en bodega de ${item.nombre}`} min="0" value={editing.value} error={editing.error} onChange={(e) => setEditing({ ...editing, value: e.target.value, error: '' })} onSubmit={saveEdit} onCancel={cancelEdit} />
                                                            ) : (
                                                                <button type="button" data-qty={item.id} onClick={() => setEditing({ id: item.id, value: String(item.cantidad), error: '' })} aria-label={`Ajustar cantidad de ${item.nombre}: ${item.cantidad}`} className="inline-flex items-center gap-1.5 font-mono font-bold text-ink min-h-[2.5rem] px-2 -mr-2 rounded-lg hover:bg-action-soft hover:text-link">
                                                                    {fmt(item.cantidad)}
                                                                    <Icon name="lapiz" className="w-3.5 h-3.5 text-muted" />
                                                                </button>
                                                            )}
                                                        </td>
                                                        <td className="hidden sm:table-cell px-2 sm:px-4 py-3"><StockBadge cantidad={item.cantidad} /></td>
                                                        <td className="px-2 sm:px-4 py-3 text-right whitespace-nowrap">
                                                            <div className="inline-flex items-center justify-end gap-1">
                                                                <button type="button" data-edit-item={item.id} onClick={() => setEditingItem({ id: item.id, categoria: item.categoria, nombre: item.nombre, ubicacion: item.ubicacion, errors: {} })} aria-label={`Editar datos de ${item.nombre}`} className={`${BTN} px-2.5 text-muted hover:text-ink hover:bg-canvas max-sm:w-9 max-sm:px-0`}>
                                                                    <Icon name="lapiz" className="w-4 h-4" /><span className="hidden lg:inline">Editar</span>
                                                                </button>
                                                                <button type="button" onClick={() => handleDeleteItem(item)} aria-label={`Eliminar ${item.nombre}`} data-del={item.id} className={`${BTN_PELIGRO} max-sm:w-9 max-sm:px-0`}><Icon name="basura" className="w-4 h-4" /><span className="hidden sm:inline">Eliminar</span></button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                    {editing && editing.id === item.id && angosta && (
                                                        <tr className="bg-canvas">
                                                            <td colSpan="6" className="px-3 pb-4 pt-1">
                                                                <EditorCantidad apilado id={`qty-${item.id}`} label={`Cantidad en bodega de ${item.nombre}`} min="0" value={editing.value} error={editing.error} onChange={(e) => setEditing({ ...editing, value: e.target.value, error: '' })} onSubmit={saveEdit} onCancel={cancelEdit} />
                                                            </td>
                                                        </tr>
                                                    )}
                                                    </React.Fragment>
                                                ))
                                            ) : (
                                                <tr><td colSpan="6" className="px-4 py-10 text-center text-sm text-muted">
                                                    {inventory.length === 0 ? (
                                                        <>La bodega está vacía. <button type="button" onClick={() => setShowAddItem(true)} className={ENLACE}>Registra el primer ítem</button></>
                                                    ) : (
                                                        <>Nada coincide con {descripcionFiltro}. {hayFiltros && <button type="button" onClick={() => { setSearchTerm(''); setFilterCategory('Todos'); }} className={ENLACE}>Limpiar búsqueda</button>}</>
                                                    )}
                                                </td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                <p className="mt-3 text-sm text-muted">Toca una cantidad <Icon name="lapiz" className="inline w-3.5 h-3.5 -mt-0.5" /> para ajustarla. "Bajo" significa {STOCK_BAJO} unidades o menos.</p>
                            </section>
                        )}

                        {/* ---------- PROYECTOS (CU-19 al CU-37) ---------- */}
                        {activeModule === 'proyectos' && (() => {
                            const visibleProjects = filterProjState === 'Todos' ? projects : projects.filter(p => p.estado === filterProjState);
                            return (
                                <section aria-labelledby="proj-title">
                                    <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                        <div>
                                            <h1 id="proj-title" tabIndex={-1} className="focus:outline-none text-2xl font-bold text-ink tracking-tight">Proyectos del taller</h1>
                                            <p className="mt-1 text-sm text-muted">Vincula cada trabajo con su lista de materiales, revisa si puedes arrancar y registra su avance.</p>
                                        </div>
                                        {!showAddProject && (
                                            <button id="btn-add-project" type="button" onClick={() => setShowAddProject(true)} className={BTN_PRIMARIO}>
                                                <Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Nuevo proyecto
                                            </button>
                                        )}
                                    </div>

                                    {showAddProject && (
                                        <form onSubmit={handleCreateProject} noValidate onKeyDown={(e) => e.key === 'Escape' && closeAddProject()} className="panel-enter mb-6 p-4 sm:p-5 bg-surface border border-line-strong rounded-2xl">
                                            <h2 className="text-base font-bold text-ink mb-3">Registrar trabajo o proyecto</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 items-start">
                                                <div>
                                                    <label htmlFor="proj-name" className={ETIQUETA}>Nombre del proyecto</label>
                                                    <input id="proj-name" type="text" autoFocus maxLength={70} placeholder="Ej. Puertas de cedro lote 4" value={newProjName} onChange={(e) => { setNewProjName(e.target.value); setProjErrors({ ...projErrors, nombre: '' }); }} aria-invalid={!!projErrors.nombre} aria-describedby={projErrors.nombre ? 'proj-name-err' : undefined} className={`${CAMPO} ${borde(projErrors.nombre)}`} />
                                                    <FieldError id="proj-name-err">{projErrors.nombre}</FieldError>
                                                </div>
                                                <div>
                                                    <label htmlFor="proj-resp" className={ETIQUETA}>Responsable</label>
                                                    <input id="proj-resp" type="text" maxLength={50} placeholder="Ej. Marco Solís" value={newProjResp} onChange={(e) => { setNewProjResp(e.target.value); setProjErrors({ ...projErrors, responsable: '' }); }} aria-invalid={!!projErrors.responsable} aria-describedby={projErrors.responsable ? 'proj-resp-err' : undefined} className={`${CAMPO} ${borde(projErrors.responsable)}`} />
                                                    <FieldError id="proj-resp-err">{projErrors.responsable}</FieldError>
                                                </div>
                                                <div>
                                                    <label htmlFor="proj-list" className={ETIQUETA}>Lista de materiales</label>
                                                    <select id="proj-list" value={newProjListId} onChange={(e) => setNewProjListId(e.target.value)} className={`${CAMPO} ${borde(false)}`}>
                                                        <option value="">Sin lista asociada</option>
                                                        {lists.map(l => (
                                                            <option key={l.id} value={l.id}>{l.nombre}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>
                                            <div className="mt-3">
                                                <label htmlFor="proj-note" className={ETIQUETA}>Notas o etapa actual (opcional)</label>
                                                <input id="proj-note" type="text" maxLength={120} placeholder="Ej. Corte de piezas listo, falta lijado y armado" value={newProjNote} onChange={(e) => setNewProjNote(e.target.value)} className={`${CAMPO} ${borde(false)}`} />
                                            </div>
                                            <div className="flex justify-end gap-2 mt-4">
                                                <button type="button" onClick={closeAddProject} className={BTN_SECUNDARIO}>Cancelar</button>
                                                <button type="submit" className={BTN_PRIMARIO}>Guardar proyecto</button>
                                            </div>
                                        </form>
                                    )}

                                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                                        <div className="flex flex-wrap gap-1.5" role="group" aria-label="Filtrar proyectos por estado">
                                            {['Todos', 'Pendiente', 'En curso', 'Terminado'].map(est => {
                                                const activo = filterProjState === est;
                                                const cuenta = est === 'Todos' ? projects.length : projects.filter(p => p.estado === est).length;
                                                return (
                                                    <button
                                                        key={est}
                                                        type="button"
                                                        onClick={() => setFilterProjState(est)}
                                                        aria-pressed={activo}
                                                        className={`min-h-[2.25rem] px-3 rounded-xl text-sm font-semibold transition-colors ${activo ? 'bg-brand text-white' : 'bg-surface text-ink-soft border border-line hover:bg-canvas'}`}
                                                    >
                                                        {est} <span className={`ml-1 font-mono text-xs ${activo ? 'text-brand-ink' : 'text-muted'}`}>({cuenta})</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {visibleProjects.length > 0 ? (
                                        <ul className="space-y-4">
                                            {visibleProjects.map(proj => {
                                                const linkedList = lists.find(l => l.id === proj.listId) || null;
                                                const rev = linkedList ? revisarLista(linkedList, inventory) : null;
                                                const stateBadge = proj.estado === 'Terminado'
                                                    ? { cls: 'bg-ok-soft text-ok', icon: 'check' }
                                                    : proj.estado === 'En curso'
                                                    ? { cls: 'bg-warn-soft text-warn', icon: 'llave' }
                                                    : { cls: 'bg-canvas text-ink-soft border border-line-strong', icon: 'carpeta' };
                                                return (
                                                    <li key={proj.id} className="bg-surface border border-line rounded-2xl p-4 sm:p-5">
                                                        <div className="flex flex-wrap items-start justify-between gap-3">
                                                            <div className="min-w-0 flex-1">
                                                                <div className="flex flex-wrap items-center gap-2">
                                                                    <h2 className="text-lg font-bold text-ink [overflow-wrap:anywhere]">{proj.nombre}</h2>
                                                                    <Badge cls={stateBadge.cls} icon={stateBadge.icon}>{proj.estado}</Badge>
                                                                </div>
                                                                <p className="mt-1 text-sm text-muted">
                                                                    Responsable: <b className="font-semibold text-ink-soft">{proj.responsable}</b> · {proj.nota}
                                                                </p>
                                                            </div>
                                                            <button type="button" data-del-proj={proj.id} onClick={() => handleDeleteProject(proj)} aria-label={`Eliminar proyecto ${proj.nombre}`} className={`${BTN_PELIGRO} max-sm:w-10 max-sm:px-0`}>
                                                                <Icon name="basura" className="w-4 h-4" /><span className="hidden sm:inline">Eliminar</span>
                                                            </button>
                                                        </div>

                                                        <div className="mt-4 pt-4 border-t border-line grid grid-cols-1 md:grid-cols-2 gap-4 items-center">
                                                            <div className="flex flex-wrap items-center gap-2">
                                                                <span className="text-sm font-semibold text-ink">Materiales:</span>
                                                                {linkedList ? (
                                                                    <>
                                                                        <ResumenBadge revision={rev} />
                                                                        <button type="button" onClick={() => { setActiveModule('listas'); openList(linkedList.id); }} className={ENLACE}>
                                                                            Ver "{linkedList.nombre}" →
                                                                        </button>
                                                                    </>
                                                                ) : (
                                                                    <span className="text-sm text-muted">Sin lista vinculada</span>
                                                                )}
                                                            </div>

                                                            <div className="flex flex-wrap items-center justify-between md:justify-end gap-3">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-sm text-muted">Avance:</span>
                                                                    <button type="button" onClick={() => handleStepProjectProgress(proj, -20)} disabled={proj.avance <= 0} aria-label={`Reducir avance de ${proj.nombre}`} className="btn-press w-8 h-8 rounded-lg border border-line-strong bg-surface text-ink font-mono font-bold hover:bg-canvas disabled:opacity-40">−</button>
                                                                    <span className="font-mono font-bold text-sm text-ink min-w-[3.25rem] text-center">{proj.avance}%</span>
                                                                    <button type="button" onClick={() => handleStepProjectProgress(proj, 20)} disabled={proj.avance >= 100} aria-label={`Aumentar avance de ${proj.nombre}`} className="btn-press w-8 h-8 rounded-lg border border-line-strong bg-surface text-ink font-mono font-bold hover:bg-canvas disabled:opacity-40">+</button>
                                                                </div>
                                                                <div className="flex items-center gap-1.5">
                                                                    <label htmlFor={`proj-state-${proj.id}`} className="sr-only">Cambiar estado de {proj.nombre}</label>
                                                                    <select id={`proj-state-${proj.id}`} value={proj.estado} onChange={(e) => handleUpdateProjectState(proj, e.target.value)} className="min-h-[2.25rem] px-2.5 py-1 border border-line-strong rounded-xl text-sm font-semibold bg-surface text-ink focus:outline-none focus:ring-2 focus:ring-link">
                                                                        <option value="Pendiente">Pendiente</option>
                                                                        <option value="En curso">En curso</option>
                                                                        <option value="Terminado">Terminado</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </li>
                                                );
                                            })}
                                        </ul>
                                    ) : (
                                        <div className="border border-dashed border-line-strong rounded-2xl p-10 text-center">
                                            <p className="text-base font-semibold text-ink">No hay proyectos en esta vista</p>
                                            <p className="mt-1 text-sm text-muted">Registra un proyecto y asócialo a una lista de materiales para seguir su estado en el taller.</p>
                                            {filterProjState !== 'Todos' ? (
                                                <button type="button" onClick={() => setFilterProjState('Todos')} className={`${BTN_SECUNDARIO} mt-4`}>Ver todos los proyectos</button>
                                            ) : (
                                                <button type="button" onClick={() => setShowAddProject(true)} className={`${BTN_PRIMARIO} mt-4`}>Crear el primer proyecto</button>
                                            )}
                                        </div>
                                    )}
                                </section>
                            );
                        })()}
                    </main>
                    <footer className="max-w-5xl w-full mx-auto px-4 sm:px-6 py-5 border-t border-line flex flex-wrap items-center justify-between gap-3 text-xs text-muted">
                        <span>¿Hay materiales? · Inventario, listas y proyectos del taller</span>
                        <button type="button" onClick={handleResetDemo} className="font-semibold text-ink-soft hover:text-link underline underline-offset-4">
                            Restaurar datos de demostración
                        </button>
                    </footer>
                    {toastEl}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
