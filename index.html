<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Hay materiales? · Sistema de taller</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23202328'/%3E%3Cpath d='M14.5 6.5a4 4 0 00-5.2 5.2L3.5 17.5l3 3 5.8-5.8a4 4 0 005.2-5.2l-2.7 2.7-2.3-.7-.7-2.3z' fill='none' stroke='%23f07a2a' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
    <!-- Archivo + JetBrains Mono: grotesca sobria para interfaz y monoespaciada técnica para códigos de bodega y cifras -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (versión fija) -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        // Paleta "grafito + naranja de seguridad": roles de color, no colores sueltos
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Archivo', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    colors: {
                        canvas: 'var(--canvas)',
                        surface: 'var(--surface)',
                        ink: 'var(--ink)',
                        'ink-soft': 'var(--ink-soft)',
                        muted: 'var(--muted)',
                        line: 'var(--line)',
                        'line-strong': 'var(--line-strong)',
                        brand: 'var(--brand)',
                        'brand-ink': 'var(--brand-ink)',
                        'brand-raised': 'var(--brand-raised)',
                        'brand-hover': 'var(--brand-hover)',
                        action: 'var(--action)',
                        'action-ink': 'var(--action-ink)',
                        'action-on-dark': 'var(--action-on-dark)',
                        link: 'var(--link)',
                        'link-hover': 'var(--link-hover)',
                        'action-hover': 'var(--action-hover)',
                        'action-soft': 'var(--action-soft)',
                        'action-line': 'var(--action-line)',
                        ok: 'var(--ok)',
                        'ok-soft': 'var(--ok-soft)',
                        warn: 'var(--warn)',
                        'warn-soft': 'var(--warn-soft)',
                        err: 'var(--err)',
                        'err-strong': 'var(--err-strong)',
                        'err-soft': 'var(--err-soft)',
                        'err-soft-hover': 'var(--err-soft-hover)',
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --canvas: oklch(0.968 0.004 150);
            --surface: oklch(1 0 0);
            --ink: oklch(0.2 0.008 150);
            --ink-soft: oklch(0.32 0.008 150);
            --muted: oklch(0.47 0.01 150);
            --line: oklch(0.9 0.005 150);
            --line-strong: oklch(0.81 0.008 150);
            --brand: oklch(0.22 0.035 155);
            --brand-ink: oklch(0.85 0.02 155);
            --brand-raised: oklch(0.29 0.04 155);
            --brand-hover: oklch(0.36 0.045 155);
            --action: oklch(0.74 0.19 150);
            --action-hover: oklch(0.68 0.19 150);
            --action-ink: oklch(0.17 0.04 155);
            --action-on-dark: oklch(0.82 0.18 150);
            --action-soft: oklch(0.96 0.04 150);
            --action-line: oklch(0.82 0.1 150);
            --link: oklch(0.45 0.13 152);
            --link-hover: oklch(0.37 0.11 152);
            --ok: oklch(0.42 0.12 152);
            --ok-soft: oklch(0.94 0.05 150);
            --warn: oklch(0.46 0.10 85);
            --warn-soft: oklch(0.95 0.08 95);
            --err: oklch(0.50 0.18 25);
            --err-strong: oklch(0.42 0.16 25);
            --err-soft: oklch(0.96 0.025 25);
            --err-soft-hover: oklch(0.92 0.045 25);
            /* Emil Kowalski custom easing curves */
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        }
        body { color: var(--ink); caret-color: var(--link); accent-color: var(--action); }
        ::selection { background: var(--action-line); color: var(--ink); }
        /* gana a la preflight de Tailwind CDN, que se inyecta después */
        input::placeholder, textarea::placeholder { color: var(--muted) !important; opacity: 1; }
        :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        td, th, .tabular { font-variant-numeric: tabular-nums; }
        h1, h2, h3 { text-wrap: balance; }
        /* La "x" nativa del buscador no sigue la paleta; usamos un botón propio */
        input[type="search"]::-webkit-search-cancel-button { display: none; }
        /* El navegador agrega su propio ojo en los campos de contraseña; usamos solo el nuestro */
        input::-ms-reveal, input::-ms-clear { display: none; }
        input[type="password"]::-webkit-credentials-auto-fill-button, input::-webkit-contacts-auto-fill-button { display: none !important; visibility: hidden; pointer-events: none; }

        /* Emil Kowalski Design Engineering: Buttons must feel responsive (scale(0.97) on press, explicit properties, never transition:all) */
        .btn-press {
            transition: transform 160ms var(--ease-out), background-color 150ms var(--ease-out), border-color 150ms var(--ease-out), color 150ms var(--ease-out);
        }
        .btn-press:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Never animate from scale(0): start from scale(0.96) + opacity with strong ease-out */
        .panel-enter {
            opacity: 1;
            transform: scale(1) translateY(0);
            transform-origin: top center;
            transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
            @starting-style {
                opacity: 0;
                transform: scale(0.97) translateY(-4px);
            }
        }

        /* Interruptible Sonner-style toast transition using @starting-style and percentage translateY */
        .toast-in {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: transform 260ms var(--ease-out), opacity 200ms ease;
            @starting-style {
                opacity: 0;
                transform: translateY(100%) scale(0.96);
            }
        }

        /* Touch device hover protection: gate row and card hover effects behind (hover: hover) and (pointer: fine) */
        .hover-row {
            transition: background-color 150ms var(--ease-out);
        }
        @media (hover: hover) and (pointer: fine) {
            .hover-row:hover {
                background-color: var(--canvas);
            }
        }

        /* Reduced motion: keep gentle opacity comprehension, remove positional movement */
        @media (prefers-reduced-motion: reduce) {
            .btn-press:active:not(:disabled) { transform: none; }
            .panel-enter, .toast-in {
                transition: opacity 150ms ease !important;
                transform: none !important;
                @starting-style {
                    opacity: 0;
                    transform: none !important;
                }
            }
        }
    </style>
    <!-- React y ReactDOM (versiones fijas: una actualización del CDN no rompe la demo) -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en tiempo real -->
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-canvas font-sans">
    <div id="root">
        <!-- Se ve mientras Babel compila; React lo reemplaza al montar -->
        <p class="min-h-screen flex items-center justify-center text-sm text-muted">Cargando el sistema…</p>
    </div>
    <noscript><p style="padding:2rem;text-align:center">Este sistema necesita JavaScript activado para funcionar.</p></noscript>

    <script type="text/babel">
        const STOCK_BAJO = 5;
        const CANTIDAD_MAX = 999999;
        const formatoNumero = new Intl.NumberFormat('es-CR');
        const fmt = (n) => formatoNumero.format(n);
        const plural = (n, uno, varios) => `${fmt(n)} ${n === 1 ? uno : varios}`;

        // Comparación sin mayúsculas ni tildes: "sierra" encuentra "Sierra", "ubicacion" encuentra "Ubicación"
        const normalizar = (texto) => texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

        // Valida un entero entre `min` y CANTIDAD_MAX; devuelve el mensaje de error o ''
        const errorCantidad = (valor, min = 0) => {
            if (String(valor).trim() === '') return 'Escribe una cantidad.';
            const n = Number(valor);
            if (!Number.isInteger(n)) return 'Usa un número entero, sin decimales.';
            if (n < min) return min === 0 ? 'La cantidad no puede ser negativa.' : `La cantidad mínima es ${min}.`;
            if (n > CANTIDAD_MAX) return `La cantidad máxima es ${fmt(CANTIDAD_MAX)}.`;
            return '';
        };


        // La rueda del mouse no debe cambiar una cantidad sin querer
        const sinRueda = (e) => e.currentTarget.blur();

        // Mueve el foco a un elemento cuando React ya lo pintó
        const enfocar = (selector, respaldo) => requestAnimationFrame(() => {
            const el = document.querySelector(selector) || (respaldo && document.querySelector(respaldo));
            el?.focus();
        });

        // Datos de ejemplo para la demostración
        const INVENTARIO_INICIAL = [
            { id: 1, categoria: 'Herramienta', nombre: 'Taladro percutor', ubicacion: 'Estante A-1', cantidad: 4, unidad: 'unidades' },
            { id: 2, categoria: 'Material', nombre: 'Tornillos de madera 2"', ubicacion: 'Caja B-3', cantidad: 150, unidad: 'unidades' },
            { id: 3, categoria: 'Herramienta', nombre: 'Sierra circular', ubicacion: 'Estante A-2', cantidad: 2, unidad: 'unidades' },
            { id: 4, categoria: 'Material', nombre: 'Pegamento de contacto', ubicacion: 'Estante C-1', cantidad: 8, unidad: 'litros' },
            { id: 5, categoria: 'Material', nombre: 'Lija grano 120', ubicacion: 'Estante C-4', cantidad: 0, unidad: 'pliegos' },
            { id: 6, categoria: 'Material', nombre: 'Tabla de pino 1x12', ubicacion: 'Rack D-1', cantidad: 24, unidad: 'metros' },
        ];
        const LISTAS_INICIALES = [
            { id: 11, nombre: 'Kit de mantenimiento general', items: [1, 2] },
            { id: 12, nombre: 'Mueble de cocina', items: [2, 4, 5, 6] },
            { id: 13, nombre: 'Mesa de comedor', items: [2, 3, 4, 6] },
        ];
        const PROYECTOS_INICIALES = [
            { id: 101, nombre: 'Mantenimiento preventivo de bancos', descripcion: 'Revisión de prensas y ajuste de mesas de corte del taller.', estado: 'En curso', listId: 11, verificados: [1], inicio: '2026-11-16T08:00:00', fin: null, historial: [{ fecha: '16/11/26, 08:00', texto: 'Estado: Pendiente → En curso' }] },
            { id: 102, nombre: 'Instalación de alacena y gabinete', descripcion: 'Alacena de dos puertas y gabinete bajo fregadero.', estado: 'Pendiente', listId: 12, verificados: [], inicio: null, fin: null, historial: [] },
            { id: 103, nombre: 'Mesa de comedor', descripcion: 'Mesa de pino para seis personas.', estado: 'Finalizado', listId: 13, verificados: [], inicio: '2026-10-01T08:00:00', fin: '2026-10-09T17:00:00', historial: [{ fecha: '09/10/26, 17:00', texto: 'Estado: En curso → Finalizado' }] },
            { id: 104, nombre: 'Mesa de comedor', descripcion: 'Mesa de pino para seis personas.', estado: 'Finalizado', listId: 13, verificados: [], inicio: '2026-10-20T08:00:00', fin: '2026-10-25T17:00:00', historial: [{ fecha: '25/10/26, 17:00', texto: 'Estado: En curso → Finalizado' }] },
        ];

        // Usuarios: la contraseña se guarda como hash PBKDF2-SHA256 con sal, nunca en texto plano (RNF-01)
        const USUARIOS = {
            admin: { sal: 'ed45740fa5b33953b907766df5c7c0fb', hash: '48168eaaeb82485e0bf8fc73dd8843b27fa79391d9b142facc8090970adfc48e', iteraciones: 100000 },
        };
        const hexABytes = (hex) => new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
        async function hashContrasena(contrasena, salHex, iteraciones) {
            const clave = await crypto.subtle.importKey('raw', new TextEncoder().encode(contrasena), 'PBKDF2', false, ['deriveBits']);
            const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hexABytes(salHex), iterations: iteraciones }, clave, 256);
            return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Estado que sobrevive a recargar la página; si el navegador bloquea el almacenamiento, sigue en memoria
        function usePersistentState(clave, inicial) {
            const [valor, setValor] = React.useState(() => {
                try {
                    const guardado = localStorage.getItem(clave);
                    return guardado ? JSON.parse(guardado) : inicial;
                } catch { return inicial; }
            });
            React.useEffect(() => {
                try { localStorage.setItem(clave, JSON.stringify(valor)); } catch {}
            }, [clave, valor]);
            return [valor, setValor];
        }

        // ¿Pantalla de celular? Cambia cómo se muestran avisos y editores en línea
        const MQ_ANGOSTA = '(max-width: 639px)';
        const esAngosta = () => { try { return window.matchMedia(MQ_ANGOSTA).matches; } catch { return false; } };
        function useAngosta() {
            const [angosta, setAngosta] = React.useState(esAngosta);
            React.useEffect(() => {
                const mq = window.matchMedia(MQ_ANGOSTA);
                const onChange = () => setAngosta(mq.matches);
                mq.addEventListener('change', onChange);
                return () => mq.removeEventListener('change', onChange);
            }, []);
            return angosta;
        }

        // ¿Pantalla ancha? Muestra listas, inventario y proyectos lado a lado con su detalle
        const MQ_ANCHA = '(min-width: 1280px)';
        function useAncha() {
            const [ancha, setAncha] = React.useState(() => { try { return window.matchMedia(MQ_ANCHA).matches; } catch { return false; } });
            React.useEffect(() => {
                const mq = window.matchMedia(MQ_ANCHA);
                const onChange = () => setAncha(mq.matches);
                mq.addEventListener('change', onChange);
                return () => mq.removeEventListener('change', onChange);
            }, []);
            return ancha;
        }

        // Editor de una cantidad. En celular va apilado en su propia fila para que nada quede fuera de pantalla
        function EditorCantidad({ id, label, value, error, min, onChange, onSubmit, onCancel, apilado }) {
            return (
                <form onSubmit={onSubmit} noValidate onKeyDown={(e) => { if (e.key === 'Escape') { e.stopPropagation(); onCancel(); } }} className={apilado ? 'flex flex-col gap-2' : 'inline-flex flex-col items-end gap-1'}>
                    <label htmlFor={id} className={apilado ? 'text-sm font-semibold text-ink' : 'sr-only'}>{label}</label>
                    <div className={apilado ? 'flex flex-col gap-2' : 'flex items-center gap-1'}>
                        <input id={id} type="number" inputMode="numeric" min={min} max={CANTIDAD_MAX} step="1" autoFocus onWheel={sinRueda} value={value} onChange={onChange} aria-invalid={!!error} aria-describedby={error ? `${id}-err` : undefined} className={`${apilado ? 'w-full' : 'w-24'} min-h-[2.5rem] px-2 border rounded-lg text-base md:text-sm font-mono text-right bg-surface focus:outline-none focus:ring-2 focus:ring-link ${borde(error)}`} />
                        <div className={apilado ? 'grid grid-cols-2 gap-2' : 'flex items-center gap-1'}>
                            <button type="button" onClick={onCancel} className={`${BTN_SECUNDARIO} px-3`}>Cancelar</button>
                            <button type="submit" className={`${BTN_PRIMARIO} px-3`}>Guardar</button>
                        </div>
                    </div>
                    <FieldError id={`${id}-err`}>{error}</FieldError>
                </form>
            );
        }

        // Íconos dibujados con un solo trazo y grosor
        const ICONOS = {
            caja: 'M21 8l-9-5-9 5v8l9 5 9-5V8z M3 8l9 5 9-5 M12 13v8',
            lista: 'M9 3h6v3H9z M9 4.5H6.5A1.5 1.5 0 005 6v13.5A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H15 M9 11.5l1.5 1.5L13 10.5 M9 16.5h6',
            carpeta: 'M3 7.5A1.5 1.5 0 014.5 6h4l2 2h9A1.5 1.5 0 0121 9.5v8a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5z',
            llave: 'M14.5 6.5a4 4 0 00-5.2 5.2L3.5 17.5l3 3 5.8-5.8a4 4 0 005.2-5.2l-2.7 2.7-2.3-.7-.7-2.3z',
            mas: 'M12 5v14 M5 12h14',
            buscar: 'M11 18a7 7 0 100-14 7 7 0 000 14z M20 20l-4-4',
            salir: 'M15 4h3.5A1.5 1.5 0 0120 5.5v13a1.5 1.5 0 01-1.5 1.5H15 M10 16l4-4-4-4 M14 12H4',
            check: 'M5 12.5l4.5 4.5L19 7.5',
            alerta: 'M12 4l9 16H3z M12 10v4 M12 17h.01',
            x: 'M6 6l12 12M18 6L6 18',
            flechaIzq: 'M15 18l-6-6 6-6',
            flechaDer: 'M9 18l6-6-6-6',
            lapiz: 'M4 20h4L19 9l-4-4L4 16v4z M13.5 6.5l4 4',
            basura: 'M4 7h16 M10 11v6 M14 11v6 M6 7l1 13h10l1-13 M9 7V4h6v3',
            orden: 'M8 9l4-4 4 4 M8 15l4 4 4-4',
            ordenAsc: 'M7 14l5-5 5 5',
            ordenDesc: 'M7 10l5 5 5-5',
            ojo: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z M12 15a3 3 0 100-6 3 3 0 000 6z',
            ojoOculto: 'M3 3l18 18 M10.6 6.2A9.9 9.9 0 0112 6c6.5 0 10 6 10 6a17 17 0 01-3.2 4 M6.6 6.7A16.6 16.6 0 002 12s3.5 6 10 6a9.7 9.7 0 004.2-.9 M9.9 9.9a3 3 0 004.2 4.2',
        };

        function Icon({ name, className = 'w-5 h-5', strokeWidth = 1.8 }) {
            return (
                <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d={ICONOS[name]} />
                </svg>
            );
        }

        // Botones: un solo sistema de tamaños para toda la app con feedback físico scale(0.97)
        const BTN = 'btn-press inline-flex items-center justify-center gap-1.5 rounded-xl text-sm font-semibold whitespace-nowrap min-h-[2.5rem] px-4';
        const BTN_PRIMARIO = `${BTN} bg-action text-action-ink hover:bg-action-hover`;
        const BTN_SECUNDARIO = `${BTN} bg-surface text-ink border border-line-strong hover:bg-canvas`;
        const BTN_PELIGRO = `${BTN} px-3 text-muted hover:text-err-strong hover:bg-err-soft`;
        const ENLACE = 'inline-flex items-center gap-1 text-sm font-semibold text-link hover:text-link-hover underline-offset-4 hover:underline';

        const CAMPO = 'w-full min-h-[2.5rem] px-3 py-2 border rounded-xl text-base md:text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-link';
        const borde = (error) => error ? 'border-err' : 'border-line-strong';
        const ETIQUETA = 'block text-sm font-semibold text-ink mb-1';

        // Estado de stock en bodega: texto + ícono, no solo color
        const stockStatus = (cantidad) => {
            if (cantidad <= 0) return { label: 'Agotado', cls: 'bg-err-soft text-err-strong', icon: 'x' };
            if (cantidad <= STOCK_BAJO) return { label: 'Bajo', cls: 'bg-warn-soft text-warn', icon: 'alerta' };
            return { label: 'Suficiente', cls: 'bg-ok-soft text-ok', icon: 'check' };
        };

        function Badge({ cls, icon, children }) {
            return (
                <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${cls}`}>
                    <Icon name={icon} className="w-3.5 h-3.5" strokeWidth={2.4} />
                    {children}
                </span>
            );
        }

        const StockBadge = ({ cantidad }) => {
            const s = stockStatus(cantidad);
            return <Badge cls={s.cls} icon={s.icon}>{s.label}</Badge>;
        };

        function FieldError({ id, children }) {
            if (!children) return null;
            return <p id={id} className="mt-1 text-sm font-medium text-err-strong">{children}</p>;
        }

        // Avisos tras cada acción: se apilan (hasta 3), cada uno con su tiempo, y se pausan al pasar el mouse o enfocar
        function ToastItem({ toast, onDismiss }) {
            const [pausado, setPausado] = React.useState(false);
            const ref = React.useRef(null);
            // Si el foco estaba en el aviso, lo devolvemos a lo restaurado o al título de la sección
            const devolverFoco = (destino) => {
                if (ref.current && ref.current.contains(document.activeElement)) enfocar(destino || 'main h1', 'main h1');
            };
            React.useEffect(() => {
                if (pausado) return;
                const t = setTimeout(() => onDismiss(toast.key), toast.action ? 8000 : 4000);
                return () => clearTimeout(t);
            }, [pausado, toast.key]);
            return (
                <div
                    ref={ref}
                    className="toast-in pointer-events-auto flex items-center gap-2 w-full sm:w-auto sm:max-w-md bg-brand text-white pl-4 pr-1.5 py-1.5 rounded-xl shadow-[0_10px_28px_-10px_oklch(0.24_0.015_260/0.55)]"
                    onMouseEnter={() => setPausado(true)} onMouseLeave={() => setPausado(false)}
                    onFocus={() => setPausado(true)} onBlur={() => setPausado(false)}
                >
                    <p className="flex-1 text-sm py-1.5 [overflow-wrap:anywhere]">{toast.message}</p>
                    {toast.action && (
                        <button type="button" onClick={() => { toast.action.run(); devolverFoco(toast.action.focusAfter); onDismiss(toast.key); }} className="shrink-0 min-h-[2.5rem] px-3 rounded-lg text-sm font-bold text-action-on-dark hover:bg-brand-raised">{toast.action.label}</button>
                    )}
                    <button type="button" onClick={() => { devolverFoco(); onDismiss(toast.key); }} aria-label="Cerrar aviso" className="shrink-0 w-10 h-10 rounded-lg text-brand-ink hover:bg-brand-raised flex items-center justify-center">
                        <Icon name="x" className="w-4 h-4" strokeWidth={2} />
                    </button>
                </div>
            );
        }

        function Toasts({ toasts, onDismiss }) {
            return (
                <div id="avisos" role="status" aria-live="polite" className="fixed bottom-4 inset-x-4 sm:inset-x-auto sm:right-6 z-50 flex flex-col items-stretch sm:items-end gap-2 pointer-events-none">
                    {toasts.map(t => <ToastItem key={t.key} toast={t} onDismiss={onDismiss} />)}
                </div>
            );
        }

        const UNIDADES = ['unidades', 'metros', 'litros', 'kilogramos', 'pliegos', 'cajas'];
        const ESTADOS = ['Pendiente', 'En curso', 'Finalizado'];

        const OPCIONES_MENU = [
            { id: 'inventario', label: 'Almacenamiento', icon: 'caja', texto: 'Herramientas y materiales del taller: registrar, editar, buscar y eliminar.' },
            { id: 'listas', label: 'Listas', icon: 'lista', texto: 'Listas de materiales para cada trabajo.' },
            { id: 'proyectos', label: 'Proyectos', icon: 'carpeta', texto: 'Proyectos del taller, su estado y la verificación de su lista.' },
        ];

        const ahora = () => new Date().toLocaleString('es-CR', { dateStyle: 'short', timeStyle: 'short' });

        // Duración legible: "5 días 9 h"
        const duracion = (ms) => {
            const horas = Math.round(ms / 3600000);
            const d = Math.floor(horas / 24), h = horas % 24;
            if (d === 0) return plural(h, 'hora', 'horas');
            return h ? `${plural(d, 'día', 'días')} ${h} h` : plural(d, 'día', 'días');
        };

        const ESTADO_BADGE = {
            'Finalizado': { cls: 'bg-ok-soft text-ok', icon: 'check' },
            'En curso': { cls: 'bg-warn-soft text-warn', icon: 'llave' },
            'Pendiente': { cls: 'bg-canvas text-ink-soft border border-line-strong', icon: 'carpeta' },
        };
        const EstadoBadge = ({ estado }) => <Badge cls={ESTADO_BADGE[estado].cls} icon={ESTADO_BADGE[estado].icon}>{estado}</Badge>;

        function App() {
            // Autenticación (RF-01 al RF-07)
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [showPassword, setShowPassword] = React.useState(false);
            const [errorMessage, setErrorMessage] = React.useState('');
            const [loginErrorField, setLoginErrorField] = React.useState(null);
            const [validando, setValidando] = React.useState(false);
            const [activeUser, setActiveUser] = React.useState('');
            const [salio, setSalio] = React.useState(false);
            const angosta = useAngosta();
            const ancha = useAncha();

            const [activeModule, setActiveModule] = React.useState('menu');

            // Almacenamiento (RF-08 al RF-23, RF-44, RF-45)
            const [inventory, setInventory] = usePersistentState('hm2-inventario', INVENTARIO_INICIAL);
            const [showAddItem, setShowAddItem] = React.useState(false);
            const [newCategory, setNewCategory] = React.useState('Herramienta');
            const [newName, setNewName] = React.useState('');
            const [newLocation, setNewLocation] = React.useState('');
            const [newQuantity, setNewQuantity] = React.useState('');
            const [newUnit, setNewUnit] = React.useState('unidades');
            const [itemErrors, setItemErrors] = React.useState({});
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterCategory, setFilterCategory] = React.useState('Todos');
            const [orden, setOrden] = React.useState('asc');
            const [editing, setEditing] = React.useState(null); // { id, value, error }
            const [editingItem, setEditingItem] = React.useState(null); // { id, nombre, ubicacion, unidad, errors }

            // Listas de materiales (RF-24 al RF-28)
            const [lists, setLists] = usePersistentState('hm2-listas', LISTAS_INICIALES);
            const [newListName, setNewListName] = React.useState('');
            const [listNameError, setListNameError] = React.useState('');
            const [showAddList, setShowAddList] = React.useState(false);
            const [selectedListId, setSelectedListId] = React.useState(null);
            const [itemToAddId, setItemToAddId] = React.useState('');
            const [addError, setAddError] = React.useState('');

            // Proyectos (RF-29 al RF-43, RF-46 al RF-49)
            const [projects, setProjects] = usePersistentState('hm2-proyectos', PROYECTOS_INICIALES);
            const [showAddProject, setShowAddProject] = React.useState(false);
            const [newProj, setNewProj] = React.useState({ nombre: '', descripcion: '', estado: 'Pendiente', listId: '' });
            const [projErrors, setProjErrors] = React.useState({});
            const [editProj, setEditProj] = React.useState(null); // { id, nombre, descripcion, error }

            // Registro de operaciones críticas (RNF-14)
            const [, setBitacora] = usePersistentState('hm2-bitacora', []);
            const registrar = (accion) => setBitacora(prev => [{ fecha: new Date().toISOString(), usuario: activeUser || username.trim(), accion }, ...prev].slice(0, 500));

            const [toasts, setToasts] = React.useState([]);
            const showToast = (message) => setToasts(prev => [...prev, { message, key: Date.now() + Math.random() }].slice(esAngosta() ? -1 : -3));
            const dismissToast = (key) => setToasts(prev => prev.filter(t => t.key !== key));

            const idRef = React.useRef(0);
            const nuevoId = () => {
                const max = Math.max(0, ...inventory.map(i => i.id), ...lists.map(l => l.id), ...projects.map(p => p.id));
                idRef.current = Math.max(idRef.current, max) + 1;
                return idRef.current;
            };

            const selectedList = lists.find(l => l.id === selectedListId) || (ancha ? lists[0] : null) || null;
            const firstItemFieldRef = React.useRef(null);
            const listNameRef = React.useRef(null);
            React.useEffect(() => { if (showAddItem) firstItemFieldRef.current?.focus(); }, [showAddItem]);
            React.useEffect(() => { if (showAddList) listNameRef.current?.focus(); }, [showAddList]);

            const goTo = (modulo) => {
                setActiveModule(modulo);
                setSelectedListId(null);
                setEditing(null);
                setEditingItem(null);
                setEditProj(null);
                enfocar('main h1');
            };

            // ---------- Sesión ----------
            const handleLogin = async (e) => {
                e.preventDefault();
                const usuario = username.trim();
                if (!usuario || !password) {
                    setLoginErrorField(!usuario && !password ? 'both' : !usuario ? 'user' : 'pass');
                    setErrorMessage(!usuario && !password ? 'Escribe tu usuario y tu contraseña para entrar.' : !usuario ? 'Escribe tu usuario para entrar.' : 'Escribe tu contraseña para entrar.');
                    enfocar(!usuario ? '#login-user' : '#login-pass');
                    return;
                }
                const cuenta = USUARIOS[usuario];
                setValidando(true);
                let valido = false;
                try { valido = !!cuenta && (await hashContrasena(password, cuenta.sal, cuenta.iteraciones)) === cuenta.hash; } catch { valido = false; }
                setValidando(false);
                if (valido) {
                    setIsLoggedIn(true);
                    setActiveUser(usuario);
                    setErrorMessage('');
                    setLoginErrorField(null);
                    setBitacora(prev => [{ fecha: new Date().toISOString(), usuario, accion: 'Inicio de sesión' }, ...prev].slice(0, 500));
                    goTo('menu');
                } else {
                    setLoginErrorField('both');
                    setErrorMessage('El usuario o la contraseña no son correctos. Revísalos e intenta de nuevo.');
                    setPassword('');
                    enfocar('#login-pass');
                }
            };

            const handleLogout = () => {
                registrar('Cierre de sesión');
                setIsLoggedIn(false);
                setUsername('');
                setPassword('');
                setShowPassword(false);
                setActiveUser('');
                goTo('menu');
            };

            const handleExit = () => { handleLogout(); setSalio(true); };

            // ---------- Almacenamiento ----------
            const avisarBajo = (item, cantidad) => {
                if (cantidad <= STOCK_BAJO) showToast(cantidad === 0 ? `Alerta: "${item.nombre}" se agotó en bodega.` : `Alerta: quedan ${fmt(cantidad)} ${item.unidad} de "${item.nombre}" (mínimo ${STOCK_BAJO}).`);
            };

            const handleAddItem = (e) => {
                e.preventDefault();
                const nombre = newName.trim();
                const ubicacion = newLocation.trim();
                const errors = {};
                if (!nombre) errors.nombre = 'Escribe el nombre.';
                else if (inventory.some(i => normalizar(i.nombre) === normalizar(nombre))) errors.nombre = `"${nombre}" ya está registrado.`;
                if (!ubicacion) errors.ubicacion = 'Indica dónde se guarda, por ejemplo Estante A-1.';
                const qtyError = errorCantidad(newQuantity);
                if (qtyError) errors.cantidad = qtyError;
                setItemErrors(errors);
                if (Object.keys(errors).length) {
                    enfocar(errors.nombre ? '#item-name' : errors.ubicacion ? '#item-loc' : '#item-qty');
                    return;
                }
                const item = { id: nuevoId(), categoria: newCategory, nombre, ubicacion, cantidad: Number(newQuantity), unidad: newCategory === 'Material' ? newUnit : 'unidades' };
                setInventory(prev => [item, ...prev]);
                setNewName(''); setNewLocation(''); setNewQuantity(''); setNewUnit('unidades');
                setShowAddItem(false);
                showToast(`Registraste ${newCategory === 'Material' ? 'el material' : 'la herramienta'} "${nombre}".`);
                avisarBajo(item, item.cantidad);
            };
            const closeAddItem = () => { setShowAddItem(false); setItemErrors({}); enfocar('#btn-add-item'); };

            const saveItemDetails = (e) => {
                e.preventDefault();
                const nombre = editingItem.nombre.trim();
                const ubicacion = editingItem.ubicacion.trim();
                const errors = {};
                if (!nombre) errors.nombre = 'Escribe el nombre.';
                else if (inventory.some(i => i.id !== editingItem.id && normalizar(i.nombre) === normalizar(nombre))) errors.nombre = `"${nombre}" ya está registrado.`;
                if (!ubicacion) errors.ubicacion = 'Indica dónde se guarda.';
                if (Object.keys(errors).length) { setEditingItem({ ...editingItem, errors }); return; }
                const id = editingItem.id;
                setInventory(prev => prev.map(i => i.id === id ? { ...i, nombre, ubicacion, unidad: editingItem.unidad } : i));
                setEditingItem(null);
                enfocar(`[data-edit-item="${id}"]`);
                showToast(`Actualizaste "${nombre}".`);
            };
            const cancelEditItem = () => { const id = editingItem?.id; setEditingItem(null); enfocar(`[data-edit-item="${id}"]`); };

            const saveEdit = (e) => {
                e.preventDefault();
                const error = errorCantidad(editing.value);
                if (error) { setEditing({ ...editing, error }); return; }
                const item = inventory.find(i => i.id === editing.id);
                const nueva = Number(editing.value);
                setInventory(prev => prev.map(i => i.id === editing.id ? { ...i, cantidad: nueva } : i));
                enfocar(`[data-qty="${editing.id}"]`);
                setEditing(null);
                if (item) { showToast(`"${item.nombre}" ahora tiene ${fmt(nueva)} ${item.unidad}.`); avisarBajo(item, nueva); }
            };
            const cancelEdit = () => { const id = editing?.id; setEditing(null); enfocar(`[data-qty="${id}"]`); };

            const handleDeleteItem = (item) => {
                const enListas = lists.filter(l => l.items.includes(item.id)).length;
                const tipo = item.categoria === 'Material' ? 'el material' : 'la herramienta';
                if (!window.confirm(`¿Eliminar ${tipo} "${item.nombre}" de forma permanente?${enListas ? ` También se quitará de ${plural(enListas, 'lista', 'listas')}.` : ''}`)) return;
                setInventory(prev => prev.filter(i => i.id !== item.id));
                setLists(prev => prev.map(l => ({ ...l, items: l.items.filter(id => id !== item.id) })));
                setProjects(prev => prev.map(p => ({ ...p, verificados: (p.verificados || []).filter(id => id !== item.id) })));
                registrar(`Eliminó ${tipo} "${item.nombre}"`);
                showToast(`Eliminaste ${tipo} "${item.nombre}".`);
                enfocar('#inv-title');
            };

            const filteredInventory = inventory
                .filter(item => (!searchTerm.trim() || normalizar(item.nombre).includes(normalizar(searchTerm))) && (filterCategory === 'Todos' || item.categoria === filterCategory))
                .sort((a, b) => orden === 'asc' ? a.nombre.localeCompare(b.nombre, 'es') : b.nombre.localeCompare(a.nombre, 'es'));
            const bajos = inventory.filter(i => i.cantidad <= STOCK_BAJO);

            const descargarReporte = () => {
                const filas = [['Nombre', 'Categoría', 'Ubicación', 'Cantidad', 'Unidad'], ...[...inventory].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es')).map(i => [i.nombre, i.categoria, i.ubicacion, i.cantidad, i.unidad])];
                const csv = '﻿' + filas.map(f => f.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                a.download = `reporte-inventario-${new Date().toISOString().slice(0, 10)}.csv`;
                a.click(); URL.revokeObjectURL(a.href);
                showToast(`Reporte generado con ${plural(filas.length - 1, 'ítem', 'ítems')}.`);
            };

            // ---------- Listas ----------
            const handleCreateList = (e) => {
                e.preventDefault();
                const nombre = newListName.trim();
                if (!nombre) { setListNameError('Escribe un nombre para la lista.'); enfocar('#list-name'); return; }
                if (lists.some(l => normalizar(l.nombre) === normalizar(nombre))) { setListNameError(`Ya existe una lista llamada "${nombre}". El nombre debe ser único.`); enfocar('#list-name'); return; }
                const id = nuevoId();
                setLists(prev => [...prev, { id, nombre, items: [] }]);
                setNewListName(''); setListNameError(''); setShowAddList(false);
                setSelectedListId(id);
                showToast(`Creaste la lista "${nombre}".`);
            };
            const closeAddList = () => { setShowAddList(false); setListNameError(''); enfocar('#btn-add-list'); };

            const openList = (id) => { setSelectedListId(id); setItemToAddId(''); setAddError(''); enfocar('#list-title'); };
            const closeList = () => { const id = selectedListId; setSelectedListId(null); enfocar(`[data-list-open="${id}"]`, '#lists-title'); };

            const handleDeleteList = (list) => {
                const usan = projects.filter(p => p.listId === list.id);
                if (!window.confirm(`¿Eliminar la lista "${list.nombre}" de forma permanente?${usan.length ? ` Se desasignará de ${plural(usan.length, 'proyecto', 'proyectos')}.` : ''}`)) return;
                setLists(prev => prev.filter(l => l.id !== list.id));
                setProjects(prev => prev.map(p => p.listId === list.id ? { ...p, listId: null, verificados: [] } : p));
                if (selectedListId === list.id) setSelectedListId(null);
                registrar(`Eliminó la lista "${list.nombre}"`);
                showToast(`Eliminaste la lista "${list.nombre}".`);
                enfocar('#lists-title');
            };

            const disponibles = selectedList ? inventory.filter(inv => !selectedList.items.includes(inv.id)) : [];

            const handleAddToList = (e) => {
                e.preventDefault();
                const item = inventory.find(i => i.id === Number(itemToAddId));
                if (!item) { setAddError('Elige una herramienta o material del inventario.'); enfocar('#list-add'); return; }
                setLists(prev => prev.map(l => l.id === selectedList.id ? { ...l, items: [...l.items, item.id] } : l));
                setItemToAddId(''); setAddError('');
                showToast(`Agregaste "${item.nombre}" a "${selectedList.nombre}".`);
                enfocar('#list-add');
            };

            const handleRemoveFromList = (item) => {
                const listId = selectedList.id;
                setLists(prev => prev.map(l => l.id === listId ? { ...l, items: l.items.filter(id => id !== item.id) } : l));
                setProjects(prev => prev.map(p => p.listId === listId ? { ...p, verificados: (p.verificados || []).filter(id => id !== item.id) } : p));
                showToast(`Quitaste "${item.nombre}" de la lista.`);
                enfocar('#list-add', '#list-title');
            };

            // ---------- Proyectos ----------
            // Una lista no puede estar en dos proyectos activos a la vez (RNF-09); los finalizados la liberan para reutilizarla
            const listaOcupada = (listId, exceptoId) => projects.some(p => p.id !== exceptoId && p.listId === listId && p.estado !== 'Finalizado');
            const enCursoActual = projects.find(p => p.estado === 'En curso') || null;
            const listasLibres = (exceptoId) => lists.filter(l => !listaOcupada(l.id, exceptoId));

            const updProj = (id, cambios, texto) => setProjects(prev => prev.map(p => p.id === id ? { ...p, ...cambios, historial: [{ fecha: ahora(), texto }, ...(p.historial || [])].slice(0, 100) } : p));

            const camposDeEstado = (proj, nuevoEstado) => {
                const c = { estado: nuevoEstado };
                if (nuevoEstado === 'En curso') { c.inicio = proj.inicio && proj.estado !== 'Finalizado' ? proj.inicio : new Date().toISOString(); c.fin = null; }
                if (nuevoEstado === 'Finalizado') c.fin = new Date().toISOString();
                if (nuevoEstado === 'Pendiente') c.fin = null;
                return c;
            };

            const handleCreateProject = (e) => {
                e.preventDefault();
                const nombre = newProj.nombre.trim();
                const descripcion = newProj.descripcion.trim();
                const errors = {};
                if (!nombre) errors.nombre = 'Escribe el nombre del proyecto.';
                if (!descripcion) errors.descripcion = 'Escribe una descripción.';
                if (newProj.estado === 'En curso' && enCursoActual) errors.estado = `Ya hay un proyecto en curso: "${enCursoActual.nombre}". Solo puede haber uno.`;
                setProjErrors(errors);
                if (Object.keys(errors).length) { enfocar(errors.nombre ? '#proj-name' : errors.descripcion ? '#proj-desc' : '#proj-state'); return; }
                const base = { id: nuevoId(), nombre, descripcion, estado: 'Pendiente', listId: newProj.listId ? Number(newProj.listId) : null, verificados: [], inicio: null, fin: null };
                const proj = { ...base, ...camposDeEstado(base, newProj.estado), historial: [{ fecha: ahora(), texto: `Creó el proyecto (estado inicial: ${newProj.estado})` }] };
                setProjects(prev => [proj, ...prev]);
                setNewProj({ nombre: '', descripcion: '', estado: 'Pendiente', listId: '' });
                setShowAddProject(false);
                showToast(`Registraste el proyecto "${nombre}".`);
            };
            const closeAddProject = () => { setShowAddProject(false); setProjErrors({}); enfocar('#btn-add-project'); };

            const handleUpdateProjectState = (proj, nuevoEstado) => {
                if (nuevoEstado === proj.estado) return;
                if (nuevoEstado === 'En curso' && enCursoActual && enCursoActual.id !== proj.id) {
                    showToast(`No se puede: "${enCursoActual.nombre}" ya está en curso. Solo puede haber un proyecto en curso.`);
                    return;
                }
                if (proj.estado === 'Finalizado' && proj.listId && listaOcupada(proj.listId, proj.id)) {
                    showToast('No se puede reabrir: su lista ya está asignada a otro proyecto activo. Desasígnela primero.');
                    return;
                }
                updProj(proj.id, camposDeEstado(proj, nuevoEstado), `Estado: ${proj.estado} → ${nuevoEstado}`);
                registrar(`Cambió el estado de "${proj.nombre}" a ${nuevoEstado}`);
                showToast(`"${proj.nombre}" pasó a ${nuevoEstado.toLowerCase()}.`);
            };

            const setListaProyecto = (proj, val) => {
                const id = val ? Number(val) : null;
                const l = lists.find(x => x.id === id);
                updProj(proj.id, { listId: id, verificados: [] }, l ? `Asoció la lista "${l.nombre}"` : 'Desasignó la lista de materiales');
                showToast(l ? `Asociaste "${l.nombre}" a "${proj.nombre}".` : `Desasignaste la lista de "${proj.nombre}".`);
            };

            const saveProj = (e) => {
                e.preventDefault();
                const nombre = editProj.nombre.trim(), descripcion = editProj.descripcion.trim();
                if (!nombre || !descripcion) { setEditProj({ ...editProj, error: 'El nombre y la descripción son obligatorios.' }); return; }
                const antes = projects.find(p => p.id === editProj.id);
                const cambios = [antes.nombre !== nombre && 'nombre', antes.descripcion !== descripcion && 'descripción'].filter(Boolean);
                if (cambios.length) updProj(editProj.id, { nombre, descripcion }, `Editó ${cambios.join(' y ')}`);
                setEditProj(null);
                showToast(`Actualizaste "${nombre}".`);
            };

            const duplicarProyecto = (proj) => {
                const conservaLista = proj.listId && !listaOcupada(proj.listId, null);
                const copia = { id: nuevoId(), nombre: proj.nombre, descripcion: proj.descripcion, estado: 'Pendiente', listId: conservaLista ? proj.listId : null, verificados: [], inicio: null, fin: null, historial: [{ fecha: ahora(), texto: `Creado a partir de "${proj.nombre}"` }] };
                setProjects(prev => [copia, ...prev]);
                showToast(conservaLista || !proj.listId ? `Duplicaste "${proj.nombre}" como proyecto pendiente.` : `Duplicaste "${proj.nombre}". Su lista está en uso por un proyecto activo, así que la copia quedó sin lista.`);
            };

            const handleDeleteProject = (proj) => {
                if (!window.confirm(`¿Eliminar el proyecto "${proj.nombre}" de forma permanente? Esta acción no se puede deshacer.`)) return;
                setProjects(prev => prev.filter(p => p.id !== proj.id));
                registrar(`Eliminó el proyecto "${proj.nombre}"`);
                showToast(`Eliminaste el proyecto "${proj.nombre}".`);
                enfocar('#proj-title');
            };

            const toggleVerificado = (proj, item) => {
                const v = proj.verificados || [];
                const on = v.includes(item.id);
                updProj(proj.id, { verificados: on ? v.filter(x => x !== item.id) : [...v, item.id] }, `${on ? 'Desmarcó' : 'Verificó'} "${item.nombre}"`);
            };

            const itemsDeLista = (lista) => lista ? lista.items.map(id => inventory.find(i => i.id === id)).filter(Boolean) : [];

            const toastEl = <Toasts toasts={toasts} onDismiss={dismissToast} />;

            // ---------- Salida de la aplicación ----------
            if (salio) return (
                <div className="min-h-screen flex items-center justify-center bg-canvas px-4"><main className="max-w-sm w-full text-center">
                    <h1 className="text-2xl font-extrabold text-ink">Saliste de la aplicación</h1>
                    <p className="mt-2 text-sm text-muted">Tus datos quedaron guardados. Ya puedes cerrar esta pestaña.</p>
                    <button type="button" onClick={() => setSalio(false)} className={`${BTN_PRIMARIO} mt-6`}>Volver a entrar</button>
                </main></div>
            );

            // ---------- Inicio de sesión ----------
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-canvas px-4 py-10">
                        <main className="max-w-sm w-full bg-surface border border-line rounded-2xl p-6 sm:p-8">
                            <div className="flex items-center gap-3 mb-8">
                                <span className="w-11 h-11 rounded-xl bg-brand text-action flex items-center justify-center"><Icon name="llave" className="w-6 h-6" /></span>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-ink tracking-tight leading-tight">¿Hay materiales?</h1>
                                    <p className="text-sm text-muted">Sistema del taller</p>
                                </div>
                            </div>
                            <form onSubmit={handleLogin} noValidate className="space-y-5">
                                {errorMessage && (
                                    <div id="login-error" role="alert" className="flex gap-2 p-3 bg-err-soft border border-err-soft-hover text-err-strong text-sm rounded-xl">
                                        <Icon name="alerta" className="w-5 h-5 shrink-0" />
                                        <span>{errorMessage}</span>
                                    </div>
                                )}
                                <div>
                                    <label htmlFor="login-user" className={ETIQUETA}>Usuario</label>
                                    <input id="login-user" type="text" value={username} onChange={(e) => setUsername(e.target.value)} autoFocus autoComplete="username" autoCapitalize="none" spellCheck="false" maxLength={40}
                                        aria-invalid={loginErrorField === 'user' || loginErrorField === 'both'} aria-describedby={errorMessage ? 'login-error' : undefined}
                                        className={`${CAMPO} ${borde(loginErrorField === 'user' || loginErrorField === 'both')}`} />
                                </div>
                                <div>
                                    <label htmlFor="login-pass" className={ETIQUETA}>Contraseña</label>
                                    <div className="relative">
                                        <input id="login-pass" type={showPassword ? 'text' : 'password'} value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" maxLength={64}
                                            aria-invalid={loginErrorField === 'pass' || loginErrorField === 'both'} aria-describedby={errorMessage ? 'login-error' : undefined}
                                            className={`${CAMPO} ${borde(loginErrorField === 'pass' || loginErrorField === 'both')} pr-12`} />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)} aria-pressed={showPassword} aria-label={showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'}
                                            className="absolute inset-y-0 right-0 px-3 my-1 mr-1 rounded-lg flex items-center text-muted hover:text-ink hover:bg-canvas">
                                            <Icon name={showPassword ? 'ojo' : 'ojoOculto'} className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" disabled={validando} className={`${BTN_PRIMARIO} w-full min-h-[2.75rem] text-base font-bold disabled:opacity-60`}>{validando ? 'Validando…' : 'Entrar'}</button>
                            </form>
                        </main>
                        {toastEl}
                    </div>
                );
            }

            // ---------- Aplicación ----------
            return (
                <div className="min-h-screen bg-canvas flex flex-col">
                    <a href="#contenido" className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-surface focus:px-3 focus:py-2 focus:rounded-lg">Saltar al contenido</a>
                    <header className="sticky top-0 z-30 bg-surface/95 backdrop-blur-md border-b border-line-strong">
                        <div className="max-w-[100rem] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
                            <button type="button" onClick={() => goTo('menu')} aria-label="Ir al menú principal" className="flex items-center gap-2.5 min-w-0 text-left">
                                <span className="w-9 h-9 rounded-xl bg-brand text-action flex items-center justify-center shrink-0"><Icon name="llave" className="w-5 h-5" /></span>
                                <p className="text-base sm:text-lg font-extrabold text-ink tracking-tight truncate">¿Hay materiales?</p>
                            </button>
                            <button type="button" onClick={handleLogout} className={`${BTN_SECUNDARIO} px-3`}>
                                <Icon name="salir" className="w-4 h-4 text-muted" /> Cerrar sesión
                            </button>
                        </div>
                    </header>

                    <main id="contenido" className="flex-1 max-w-[100rem] w-full mx-auto px-4 sm:px-6 pt-8 pb-28 sm:pb-12">
                        {activeModule !== 'menu' && (
                            <button type="button" onClick={() => goTo('menu')} className={`${BTN_SECUNDARIO} mb-5`}>
                                <Icon name="flechaIzq" className="w-4 h-4" strokeWidth={2.2} /> Volver al menú principal
                            </button>
                        )}

                        {/* ---------- MENÚ PRINCIPAL (RF-05, RF-06) ---------- */}
                        {activeModule === 'menu' && (
                            <section aria-labelledby="menu-title" className="max-w-3xl mx-auto">
                                <h1 id="menu-title" tabIndex={-1} className="focus:outline-none text-3xl sm:text-4xl font-extrabold text-ink tracking-tight">¡Bienvenido, {activeUser}!</h1>
                                <p className="mt-2 text-muted">Menú principal. Elige una opción.</p>
                                <ul className="mt-8 grid gap-3">
                                    {OPCIONES_MENU.map(o => (
                                        <li key={o.id}>
                                            <button type="button" onClick={() => goTo(o.id)} className="btn-press w-full flex items-center gap-4 p-5 bg-surface border border-line rounded-2xl text-left hover:border-line-strong">
                                                <span className="w-12 h-12 rounded-xl bg-brand text-action flex items-center justify-center shrink-0"><Icon name={o.icon} className="w-6 h-6" /></span>
                                                <span className="flex-1 min-w-0">
                                                    <span className="block text-lg font-bold text-ink">{o.label}</span>
                                                    <span className="block text-sm text-muted">{o.texto}</span>
                                                </span>
                                                <Icon name="flechaDer" className="w-5 h-5 text-muted" />
                                            </button>
                                        </li>
                                    ))}
                                    <li>
                                        <button type="button" onClick={handleExit} className="btn-press w-full flex items-center gap-4 p-5 bg-surface border border-line rounded-2xl text-left hover:border-line-strong">
                                            <span className="w-12 h-12 rounded-xl bg-canvas border border-line-strong text-ink-soft flex items-center justify-center shrink-0"><Icon name="salir" className="w-6 h-6" /></span>
                                            <span className="flex-1 min-w-0">
                                                <span className="block text-lg font-bold text-ink">Salir</span>
                                                <span className="block text-sm text-muted">Cierra la sesión y sale de la aplicación.</span>
                                            </span>
                                        </button>
                                    </li>
                                </ul>
                            </section>
                        )}

                        {/* ---------- ALMACENAMIENTO (RF-08 al RF-23, RF-44, RF-45) ---------- */}
                        {activeModule === 'inventario' && (
                            <section aria-labelledby="inv-title">
                                <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                    <div>
                                        <h1 id="inv-title" tabIndex={-1} className="focus:outline-none text-2xl font-bold text-ink tracking-tight">Almacenamiento</h1>
                                        <p className="mt-1 text-sm text-muted">{plural(inventory.length, 'ítem registrado', 'ítems registrados')} en el inventario.</p>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        <button type="button" onClick={descargarReporte} className={BTN_SECUNDARIO}>Generar reporte (CSV)</button>
                                        {!showAddItem && !ancha && (
                                            <button id="btn-add-item" type="button" onClick={() => setShowAddItem(true)} className={BTN_PRIMARIO}><Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Registrar</button>
                                        )}
                                    </div>
                                </div>

                                {bajos.length > 0 && (
                                    <div role="alert" className="mb-5 flex items-start gap-3 p-4 bg-warn-soft border border-line-strong rounded-2xl text-sm text-ink">
                                        <Icon name="alerta" className="w-5 h-5 text-warn shrink-0" />
                                        <p><b>Inventario bajo</b> (mínimo {STOCK_BAJO}): {bajos.map(i => `${i.nombre} (${fmt(i.cantidad)})`).join(' · ')}</p>
                                    </div>
                                )}

                                <div className={ancha ? 'grid grid-cols-[minmax(0,1fr)_20rem] gap-6 items-start' : ''}>
                                    {(showAddItem || ancha) && (
                                        <form onSubmit={handleAddItem} noValidate onKeyDown={(e) => !ancha && e.key === 'Escape' && closeAddItem()} className={`${ancha ? 'order-2 p-5' : 'panel-enter mb-6 p-4 sm:p-5'} bg-surface border border-line-strong rounded-2xl`}>
                                            <h2 className="text-base font-bold text-ink mb-3">Registrar herramienta o material</h2>
                                            <div className={`grid grid-cols-1 ${ancha ? '' : 'md:grid-cols-2'} gap-3 items-start`}>
                                                <div>
                                                    <label htmlFor="item-cat" className={ETIQUETA}>Tipo</label>
                                                    <select id="item-cat" value={newCategory} onChange={(e) => setNewCategory(e.target.value)} className={`${CAMPO} ${borde(false)}`}>
                                                        <option value="Herramienta">Herramienta</option>
                                                        <option value="Material">Material</option>
                                                    </select>
                                                </div>
                                                <div className="min-w-0">
                                                    <label htmlFor="item-name" className={ETIQUETA}>Nombre</label>
                                                    <input id="item-name" ref={firstItemFieldRef} type="text" value={newName} onChange={(e) => { setNewName(e.target.value); setItemErrors({ ...itemErrors, nombre: '' }); }} maxLength={80} aria-invalid={!!itemErrors.nombre} aria-describedby={itemErrors.nombre ? 'item-name-err' : undefined} className={`${CAMPO} ${borde(itemErrors.nombre)}`} />
                                                    <FieldError id="item-name-err">{itemErrors.nombre}</FieldError>
                                                </div>
                                                <div>
                                                    <label htmlFor="item-loc" className={ETIQUETA}>Ubicación física</label>
                                                    <input id="item-loc" type="text" placeholder="Ej. Estante A-1" value={newLocation} onChange={(e) => { setNewLocation(e.target.value); setItemErrors({ ...itemErrors, ubicacion: '' }); }} maxLength={40} aria-invalid={!!itemErrors.ubicacion} aria-describedby={itemErrors.ubicacion ? 'item-loc-err' : undefined} className={`${CAMPO} ${borde(itemErrors.ubicacion)}`} />
                                                    <FieldError id="item-loc-err">{itemErrors.ubicacion}</FieldError>
                                                </div>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <label htmlFor="item-qty" className={ETIQUETA}>Cantidad</label>
                                                        <input id="item-qty" type="number" inputMode="numeric" min="0" max={CANTIDAD_MAX} step="1" onWheel={sinRueda} value={newQuantity} onChange={(e) => { setNewQuantity(e.target.value); setItemErrors({ ...itemErrors, cantidad: '' }); }} aria-invalid={!!itemErrors.cantidad} aria-describedby={itemErrors.cantidad ? 'item-qty-err' : undefined} className={`${CAMPO} ${borde(itemErrors.cantidad)}`} />
                                                    </div>
                                                    <div>
                                                        <label htmlFor="item-unit" className={ETIQUETA}>Unidad</label>
                                                        {newCategory === 'Material' ? (
                                                            <select id="item-unit" value={newUnit} onChange={(e) => setNewUnit(e.target.value)} className={`${CAMPO} ${borde(false)}`}>
                                                                {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                                                            </select>
                                                        ) : (
                                                            <input id="item-unit" type="text" value="unidades" disabled className={`${CAMPO} ${borde(false)} text-muted`} />
                                                        )}
                                                    </div>
                                                    <div className="col-span-2"><FieldError id="item-qty-err">{itemErrors.cantidad}</FieldError></div>
                                                </div>
                                            </div>
                                            <div className="flex justify-end gap-2 mt-4">
                                                {!ancha && <button type="button" onClick={closeAddItem} className={BTN_SECUNDARIO}>Cancelar</button>}
                                                <button type="submit" className={`${BTN_PRIMARIO} ${ancha ? 'w-full' : ''}`}>Guardar</button>
                                            </div>
                                        </form>
                                    )}

                                    <div className={ancha ? 'order-1 min-w-0' : ''}>
                                        <div className="flex flex-col sm:flex-row gap-3 mb-4">
                                            <div className="relative flex-1 sm:max-w-sm">
                                                <label htmlFor="inv-search" className="sr-only">Buscar por nombre</label>
                                                <span className="absolute left-3 inset-y-0 flex items-center text-muted pointer-events-none"><Icon name="buscar" className="w-4 h-4" /></span>
                                                <input id="inv-search" type="search" placeholder="Buscar por nombre" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} maxLength={80} className={`${CAMPO} ${borde(false)} pl-9`} />
                                            </div>
                                            <label htmlFor="inv-filter" className="sr-only">Filtrar</label>
                                            <select id="inv-filter" value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)} className={`${CAMPO} ${borde(false)} sm:w-auto`}>
                                                <option value="Todos">Todo el inventario</option>
                                                <option value="Herramienta">Solo herramientas</option>
                                                <option value="Material">Solo materiales</option>
                                            </select>
                                            <label htmlFor="inv-order" className="sr-only">Ordenar</label>
                                            <select id="inv-order" value={orden} onChange={(e) => setOrden(e.target.value)} className={`${CAMPO} ${borde(false)} sm:w-auto`}>
                                                <option value="asc">Ordenar A-Z</option>
                                                <option value="desc">Ordenar Z-A</option>
                                            </select>
                                        </div>

                                        {editingItem && (
                                            <form onSubmit={saveItemDetails} noValidate onKeyDown={(e) => e.key === 'Escape' && cancelEditItem()} className="panel-enter mb-4 p-4 sm:p-5 bg-surface border border-line-strong rounded-2xl">
                                                <h2 className="text-base font-bold text-ink mb-3">Editar {editingItem.categoria === 'Material' ? 'material' : 'herramienta'}</h2>
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 items-start">
                                                    <div>
                                                        <label htmlFor="edit-name" className={ETIQUETA}>Nombre</label>
                                                        <input id="edit-name" type="text" autoFocus maxLength={80} value={editingItem.nombre} onChange={(e) => setEditingItem({ ...editingItem, nombre: e.target.value, errors: { ...editingItem.errors, nombre: '' } })} aria-invalid={!!editingItem.errors?.nombre} className={`${CAMPO} ${borde(editingItem.errors?.nombre)}`} />
                                                        <FieldError id="edit-name-err">{editingItem.errors?.nombre}</FieldError>
                                                    </div>
                                                    <div>
                                                        <label htmlFor="edit-loc" className={ETIQUETA}>Ubicación física</label>
                                                        <input id="edit-loc" type="text" maxLength={40} value={editingItem.ubicacion} onChange={(e) => setEditingItem({ ...editingItem, ubicacion: e.target.value, errors: { ...editingItem.errors, ubicacion: '' } })} aria-invalid={!!editingItem.errors?.ubicacion} className={`${CAMPO} ${borde(editingItem.errors?.ubicacion)}`} />
                                                        <FieldError id="edit-loc-err">{editingItem.errors?.ubicacion}</FieldError>
                                                    </div>
                                                    {editingItem.categoria === 'Material' && (
                                                        <div>
                                                            <label htmlFor="edit-unit" className={ETIQUETA}>Unidad de medida</label>
                                                            <select id="edit-unit" value={editingItem.unidad} onChange={(e) => setEditingItem({ ...editingItem, unidad: e.target.value })} className={`${CAMPO} ${borde(false)}`}>
                                                                {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                                                            </select>
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="flex justify-end gap-2 mt-4">
                                                    <button type="button" onClick={cancelEditItem} className={BTN_SECUNDARIO}>Cancelar</button>
                                                    <button type="submit" className={BTN_PRIMARIO}>Guardar cambios</button>
                                                </div>
                                            </form>
                                        )}

                                        <div className="relative overflow-x-auto bg-surface border border-line rounded-2xl">
                                            <table className="w-full text-left border-collapse">
                                                <caption className="sr-only">Inventario: se muestran {filteredInventory.length} de {inventory.length} ítems</caption>
                                                <thead>
                                                    <tr className="text-sm text-muted border-b border-line">
                                                        <th scope="col" className="pl-3 pr-2 sm:px-4 py-3 font-semibold">Nombre</th>
                                                        <th scope="col" className="hidden md:table-cell px-4 py-3 font-semibold">Tipo</th>
                                                        <th scope="col" className="hidden sm:table-cell px-4 py-3 font-semibold">Ubicación</th>
                                                        <th scope="col" className="px-2 sm:px-4 py-3 font-semibold text-right">Cantidad</th>
                                                        <th scope="col" className="hidden sm:table-cell px-2 sm:px-4 py-3 font-semibold">Estado</th>
                                                        <th scope="col" className="px-2 sm:px-4 py-3"><span className="sr-only">Acciones</span></th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-line text-sm text-ink-soft">
                                                    {filteredInventory.length > 0 ? filteredInventory.map(item => (
                                                        <React.Fragment key={item.id}>
                                                            <tr>
                                                                <th scope="row" className="pl-3 pr-2 sm:px-4 py-3 font-semibold text-ink min-w-[7rem] max-w-[18rem] [overflow-wrap:anywhere]">
                                                                    {item.nombre}
                                                                    <span className="sm:hidden block text-xs font-mono font-normal text-muted mt-0.5">{item.ubicacion}</span>
                                                                    <span className="sm:hidden block mt-1.5"><StockBadge cantidad={item.cantidad} /></span>
                                                                </th>
                                                                <td className="hidden md:table-cell px-4 py-3 whitespace-nowrap">{item.categoria}</td>
                                                                <td className="hidden sm:table-cell px-4 py-3 font-mono text-xs [overflow-wrap:anywhere]">{item.ubicacion}</td>
                                                                <td className="px-2 sm:px-4 py-3 text-right whitespace-nowrap">
                                                                    {editing && editing.id === item.id && !angosta ? (
                                                                        <EditorCantidad id={`qty-${item.id}`} label={`Cantidad de ${item.nombre}`} min="0" value={editing.value} error={editing.error} onChange={(e) => setEditing({ ...editing, value: e.target.value, error: '' })} onSubmit={saveEdit} onCancel={cancelEdit} />
                                                                    ) : (
                                                                        <button type="button" data-qty={item.id} onClick={() => setEditing({ id: item.id, value: String(item.cantidad), error: '' })} aria-label={`Editar cantidad de ${item.nombre}: ${item.cantidad} ${item.unidad}`} className="inline-flex items-center gap-1.5 font-mono font-bold text-ink min-h-[2.5rem] px-2 -mr-2 rounded-lg hover:bg-action-soft hover:text-link">
                                                                            {fmt(item.cantidad)} <span className="font-sans font-normal text-xs text-muted">{item.unidad}</span>
                                                                            <Icon name="lapiz" className="w-3.5 h-3.5 text-muted" />
                                                                        </button>
                                                                    )}
                                                                </td>
                                                                <td className="hidden sm:table-cell px-2 sm:px-4 py-3"><StockBadge cantidad={item.cantidad} /></td>
                                                                <td className="px-2 sm:px-4 py-3 text-right whitespace-nowrap">
                                                                    <div className="inline-flex items-center justify-end gap-1">
                                                                        <button type="button" data-edit-item={item.id} onClick={() => setEditingItem({ id: item.id, categoria: item.categoria, nombre: item.nombre, ubicacion: item.ubicacion, unidad: item.unidad, errors: {} })} aria-label={`Editar ${item.nombre}`} className={`${BTN} px-2.5 text-muted hover:text-ink hover:bg-canvas`}>
                                                                            <Icon name="lapiz" className="w-4 h-4" /><span className="hidden lg:inline">Editar</span>
                                                                        </button>
                                                                        <button type="button" onClick={() => handleDeleteItem(item)} aria-label={`Eliminar ${item.nombre}`} className={`${BTN_PELIGRO} max-sm:w-9 max-sm:px-0`}><Icon name="basura" className="w-4 h-4" /><span className="hidden sm:inline">Eliminar</span></button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                            {editing && editing.id === item.id && angosta && (
                                                                <tr className="bg-canvas"><td colSpan="6" className="px-3 pb-4 pt-1">
                                                                    <EditorCantidad apilado id={`qty-${item.id}`} label={`Cantidad de ${item.nombre}`} min="0" value={editing.value} error={editing.error} onChange={(e) => setEditing({ ...editing, value: e.target.value, error: '' })} onSubmit={saveEdit} onCancel={cancelEdit} />
                                                                </td></tr>
                                                            )}
                                                        </React.Fragment>
                                                    )) : (
                                                        <tr><td colSpan="6" className="px-4 py-10 text-center text-sm text-muted">
                                                            {inventory.length === 0 ? 'El inventario está vacío.' : 'Ningún ítem coincide con la búsqueda.'}
                                                        </td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                        <p className="mt-3 text-sm text-muted">Toca una cantidad <Icon name="lapiz" className="inline w-3.5 h-3.5 -mt-0.5" /> para editarla.</p>
                                    </div>
                                </div>
                            </section>
                        )}

                        {/* ---------- LISTAS DE MATERIALES (RF-24 al RF-28) ---------- */}
                        {activeModule === 'listas' && (
                            <div className={ancha ? 'grid grid-cols-[minmax(19rem,26rem)_minmax(0,1fr)] gap-6 items-start' : ''}>
                                {(ancha || !selectedList) && (
                                    <section aria-labelledby="lists-title">
                                        <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                            <div>
                                                <h1 id="lists-title" tabIndex={-1} className="focus:outline-none text-2xl font-bold text-ink tracking-tight">Listas de materiales</h1>
                                                <p className="mt-1 text-sm text-muted">{plural(lists.length, 'lista creada', 'listas creadas')}.</p>
                                            </div>
                                            {!showAddList && (
                                                <button id="btn-add-list" type="button" onClick={() => setShowAddList(true)} className={BTN_PRIMARIO}><Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Nueva lista</button>
                                            )}
                                        </div>
                                        {showAddList && (
                                            <form onSubmit={handleCreateList} noValidate onKeyDown={(e) => e.key === 'Escape' && closeAddList()} className="panel-enter mb-6 p-4 bg-surface border border-line-strong rounded-2xl">
                                                <label htmlFor="list-name" className={ETIQUETA}>Nombre de la lista (único)</label>
                                                <input id="list-name" ref={listNameRef} type="text" value={newListName} onChange={(e) => { setNewListName(e.target.value); setListNameError(''); }} maxLength={60} aria-invalid={!!listNameError} aria-describedby={listNameError ? 'list-name-err' : undefined} className={`${CAMPO} ${borde(listNameError)}`} />
                                                <FieldError id="list-name-err">{listNameError}</FieldError>
