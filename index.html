<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Hay materiales ? - Sistema de Taller</title>
    <!-- Tailwind CSS para diseño minimalista y limpio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar JSX en tiempo real -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-emerald-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Estados de Autenticación (CU-01, CU-03)
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [showPassword, setShowPassword] = React.useState(false);
            const [errorMessage, setErrorMessage] = React.useState('');
            const [welcomeMessage, setWelcomeMessage] = React.useState('');
            
            // Estado del Menú Principal (CU-02)
            const [activeModule, setActiveModule] = React.useState('menu');

            // Manejo de Inicio de Sesión (CU-01)
            const handleLogin = (e) => {
                e.preventDefault();
                if (username === 'admin' && password === '12345') {
                    setIsLoggedIn(true);
                    setWelcomeMessage(`¡Bienvenido al sistema, ${username.toUpperCase()}!`);
                    setErrorMessage('');
                    setActiveModule('menu');
                } else {
                    setErrorMessage('Credenciales incorrectas. Verifique usuario y contraseña.');
                    setPassword('');
                }
            };

            // Manejo de Cierre de Sesión (CU-02)
            const handleLogout = () => {
                if (window.confirm('¿Está seguro de que desea cerrar sesión?')) {
                    setIsLoggedIn(false);
                    setUsername('');
                    setPassword('');
                    setActiveModule('menu');
                }
            };

            // Pantalla de Login Minimalista (Verde y Blanco)
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-emerald-50 px-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-emerald-100 p-8">
                            
                            <div className="text-center mb-8">
                                <div className="inline-block p-3 bg-emerald-100 text-emerald-700 rounded-full text-2xl mb-3 shadow-inner">
                                    🛠️
                                </div>
                                <h1 className="text-3xl font-extrabold text-emerald-900 tracking-tight">
                                    ¿Hay materiales ?
                                </h1>
                                <p className="text-sm text-emerald-600 mt-1 font-medium">
                                    Sistema de control de inventario y proyectos
                                </p>
                            </div>

                            {errorMessage && (
                                <div className="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded-lg">
                                    {errorMessage}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Usuario</label>
                                    <input 
                                        type="text" 
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        required
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition"
                                        placeholder="Ej. admin"
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Contraseña</label>
                                    <div className="relative">
                                        <input 
                                            type={showPassword ? "text" : "password"} 
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            required
                                            className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition pr-12"
                                            placeholder="••••••"
                                        />
                                        <button 
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            className="absolute inset-y-0 right-0 px-3.5 flex items-center text-xs font-semibold text-emerald-700 hover:text-emerald-900"
                                        >
                                            {showPassword ? "Ocultar" : "Ver"}
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition duration-200 shadow-lg shadow-emerald-600/20"
                                >
                                    Iniciar Sesión
                                </button>
                            </form>

                            <div className="mt-6 text-center text-xs text-slate-400">
                                Acceso de prueba: <b>admin</b> / <b>12345</b>
                            </div>
                        </div>
                    </div>
                );
            }

            // Menú Principal Vertical y Estética Natural
            return (
                <div className="min-h-screen bg-emerald-50/50 flex flex-col">
                    <header className="bg-white shadow-sm border-b border-emerald-100 px-6 py-4 flex justify-between items-center">
                        <div>
                            <h2 className="text-xl font-extrabold text-emerald-900 tracking-tight">¿Hay materiales ?</h2>
                            <p className="text-xs text-emerald-600 font-medium">{welcomeMessage}</p>
                        </div>
                        <button 
                            onClick={handleLogout}
                            className="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl text-sm font-semibold transition"
                        >
                            Cerrar Sesión
                        </button>
                    </header>

                    <main className="flex-1 max-w-2xl w-full mx-auto p-6 flex flex-col justify-center">
                        {activeModule === 'menu' && (
                            <div className="bg-white rounded-2xl shadow-sm border border-emerald-100 p-8">
                                <h3 className="text-xl font-bold text-slate-800 mb-6 text-center">Menú Principal</h3>
                                
                                {/* Opciones de menú en disposición vertical */}
                                <div className="flex flex-col space-y-4">
                                    <div 
                                        onClick={() => setActiveModule('almacenamiento')}
                                        className="flex items-center p-4 bg-emerald-50/50 hover:bg-emerald-100/60 border border-emerald-200/60 rounded-xl transition cursor-pointer group shadow-sm"
                                    >
                                        <div className="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-xl font-bold mr-4 shadow-sm group-hover:scale-105 transition">📦</div>
                                        <div className="flex-1">
                                            <h4 className="text-base font-bold text-slate-800">Almacenamiento</h4>
                                            <p className="text-xs text-slate-500">Gestionar herramientas, materiales, inventario y stock.</p>
                                        </div>
                                        <span className="text-emerald-600 font-bold text-lg px-2">→</span>
                                    </div>

                                    <div 
                                        onClick={() => setActiveModule('listas')}
                                        className="flex items-center p-4 bg-emerald-50/50 hover:bg-emerald-100/60 border border-emerald-200/60 rounded-xl transition cursor-pointer group shadow-sm"
                                    >
                                        <div className="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-xl font-bold mr-4 shadow-sm group-hover:scale-105 transition">📋</div>
                                        <div className="flex-1">
                                            <h4 className="text-base font-bold text-slate-800">Listas de Materiales</h4>
                                            <p className="text-xs text-slate-500">Crear listas de verificación y asignar ítems del inventario.</p>
                                        </div>
                                        <span className="text-emerald-600 font-bold text-lg px-2">→</span>
                                    </div>

                                    <div 
                                        onClick={() => setActiveModule('proyectos')}
                                        className="flex items-center p-4 bg-emerald-50/50 hover:bg-emerald-100/60 border border-emerald-200/60 rounded-xl transition cursor-pointer group shadow-sm"
                                    >
                                        <div className="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-xl font-bold mr-4 shadow-sm group-hover:scale-105 transition">📊</div>
                                        <div className="flex-1">
                                            <h4 className="text-base font-bold text-slate-800">Proyectos</h4>
                                            <p className="text-xs text-slate-500">Administrar proyectos en curso, pendientes y su progreso.</p>
                                        </div>
                                        <span className="text-emerald-600 font-bold text-lg px-2">→</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeModule === 'almacenamiento' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Módulo de Almacenamiento</h3>
                                    <button onClick={() => setActiveModule('menu')} className="text-sm text-emerald-600 font-semibold hover:underline">← Volver al Menú</button>
                                </div>
                                <p className="text-slate-500 text-sm">Próximamente: Registro, edición y filtrado de herramientas y materiales (CU-04 al CU-13).</p>
                            </div>
                        )}

                        {activeModule === 'listas' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Módulo de Listas de Materiales</h3>
                                    <button onClick={() => setActiveModule('menu')} className="text-sm text-emerald-600 font-semibold hover:underline">← Volver al Menú</button>
                                </div>
                                <p className="text-slate-500 text-sm">Próximamente: Creación de listas de verificación y asociación (CU-14 al CU-18).</p>
                            </div>
                        )}

                        {activeModule === 'proyectos' && (
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Módulo de Proyectos</h3>
                                    <button onClick={() => setActiveModule('menu')} className="text-sm text-emerald-600 font-semibold hover:underline">← Volver al Menú</button>
                                </div>
                                <p className="text-slate-500 text-sm">Próximamente: Estados de proyectos, seguimiento y progreso (CU-19 al CU-37).</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
