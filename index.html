<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Hay materiales? · Sistema de taller</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23202328'/%3E%3Cpath d='M14.5 6.5a4 4 0 00-5.2 5.2L3.5 17.5l3 3 5.8-5.8a4 4 0 005.2-5.2l-2.7 2.7-2.3-.7-.7-2.3z' fill='none' stroke='%23f07a2a' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
    <!-- Archivo + JetBrains Mono: grotesca sobria para interfaz y monoespaciada técnica para códigos de bodega y cifras -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (versión fija) -->
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        // Paleta "grafito + naranja de seguridad": roles de color, no colores sueltos
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Archivo', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                    colors: {
                        canvas: 'var(--canvas)',
                        surface: 'var(--surface)',
                        ink: 'var(--ink)',
                        'ink-soft': 'var(--ink-soft)',
                        muted: 'var(--muted)',
                        line: 'var(--line)',
                        'line-strong': 'var(--line-strong)',
                        brand: 'var(--brand)',
                        'brand-ink': 'var(--brand-ink)',
                        'brand-raised': 'var(--brand-raised)',
                        'brand-hover': 'var(--brand-hover)',
                        action: 'var(--action)',
                        'action-ink': 'var(--action-ink)',
                        'action-on-dark': 'var(--action-on-dark)',
                        link: 'var(--link)',
                        'link-hover': 'var(--link-hover)',
                        'action-hover': 'var(--action-hover)',
                        'action-soft': 'var(--action-soft)',
                        'action-line': 'var(--action-line)',
                        ok: 'var(--ok)',
                        'ok-soft': 'var(--ok-soft)',
                        warn: 'var(--warn)',
                        'warn-soft': 'var(--warn-soft)',
                        err: 'var(--err)',
                        'err-strong': 'var(--err-strong)',
                        'err-soft': 'var(--err-soft)',
                        'err-soft-hover': 'var(--err-soft-hover)',
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --canvas: oklch(0.975 0.003 260);
            --surface: oklch(1 0 0);
            --ink: oklch(0.24 0.015 260);
            --ink-soft: oklch(0.35 0.015 260);
            --muted: oklch(0.48 0.015 260);
            --line: oklch(0.91 0.005 260);
            --line-strong: oklch(0.83 0.008 260);
            --brand: oklch(0.27 0.015 260);
            --brand-ink: oklch(0.84 0.01 260);
            --brand-raised: oklch(0.34 0.015 260);
            --brand-hover: oklch(0.40 0.015 260);
            --action: oklch(0.68 0.18 45);
            --action-hover: oklch(0.63 0.18 45);
            --action-ink: oklch(0.20 0.04 45);
            --action-on-dark: oklch(0.80 0.15 55);
            --action-soft: oklch(0.96 0.025 60);
            --action-line: oklch(0.84 0.08 55);
            --link: oklch(0.50 0.15 42);
            --link-hover: oklch(0.42 0.13 42);
            --ok: oklch(0.44 0.11 155);
            --ok-soft: oklch(0.95 0.04 155);
            --warn: oklch(0.46 0.10 85);
            --warn-soft: oklch(0.95 0.08 95);
            --err: oklch(0.50 0.18 25);
            --err-strong: oklch(0.42 0.16 25);
            --err-soft: oklch(0.96 0.025 25);
            --err-soft-hover: oklch(0.92 0.045 25);
            /* Emil Kowalski custom easing curves */
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
            --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
        }
        body { color: var(--ink); caret-color: var(--link); accent-color: var(--action); }
        ::selection { background: var(--action-line); color: var(--ink); }
        /* gana a la preflight de Tailwind CDN, que se inyecta después */
        input::placeholder, textarea::placeholder { color: var(--muted) !important; opacity: 1; }
        :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
        td, th, .tabular { font-variant-numeric: tabular-nums; }
        h1, h2, h3 { text-wrap: balance; }
        /* La "x" nativa del buscador no sigue la paleta; usamos un botón propio */
        input[type="search"]::-webkit-search-cancel-button { display: none; }

        /* Emil Kowalski Design Engineering: Buttons must feel responsive (scale(0.97) on press, explicit properties, never transition:all) */
        .btn-press {
            transition: transform 160ms var(--ease-out), background-color 150ms var(--ease-out), border-color 150ms var(--ease-out), color 150ms var(--ease-out);
        }
        .btn-press:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Never animate from scale(0): start from scale(0.96) + opacity with strong ease-out */
        .panel-enter {
            opacity: 1;
            transform: scale(1) translateY(0);
            transform-origin: top center;
            transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
            @starting-style {
                opacity: 0;
                transform: scale(0.97) translateY(-4px);
            }
        }

        /* Interruptible Sonner-style toast transition using @starting-style and percentage translateY */
        .toast-in {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: transform 260ms var(--ease-out), opacity 200ms ease;
            @starting-style {
                opacity: 0;
                transform: translateY(100%) scale(0.96);
            }
        }

        /* Touch device hover protection: gate row and card hover effects behind (hover: hover) and (pointer: fine) */
        .hover-row {
            transition: background-color 150ms var(--ease-out);
        }
        @media (hover: hover) and (pointer: fine) {
            .hover-row:hover {
                background-color: var(--canvas);
            }
        }

        /* Reduced motion: keep gentle opacity comprehension, remove positional movement */
        @media (prefers-reduced-motion: reduce) {
            .btn-press:active:not(:disabled) { transform: none; }
            .panel-enter, .toast-in {
                transition: opacity 150ms ease !important;
                transform: none !important;
                @starting-style {
                    opacity: 0;
                    transform: none !important;
                }
            }
        }
    </style>
    <!-- React y ReactDOM (versiones fijas: una actualización del CDN no rompe la demo) -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en tiempo real -->
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-canvas font-sans">
    <div id="root">
        <!-- Se ve mientras Babel compila; React lo reemplaza al montar -->
        <p class="min-h-screen flex items-center justify-center text-sm text-muted">Cargando el sistema…</p>
    </div>
    <noscript><p style="padding:2rem;text-align:center">Este sistema necesita JavaScript activado para funcionar.</p></noscript>

    <script type="text/babel">
        const STOCK_BAJO = 5;
        const CANTIDAD_MAX = 999999;
        const formatoNumero = new Intl.NumberFormat('es-CR');
        const fmt = (n) => formatoNumero.format(n);
        const plural = (n, uno, varios) => `${fmt(n)} ${n === 1 ? uno : varios}`;

        // Comparación sin mayúsculas ni tildes: "sierra" encuentra "Sierra", "ubicacion" encuentra "Ubicación"
        const normalizar = (texto) => texto.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();

        // Valida un entero entre `min` y CANTIDAD_MAX; devuelve el mensaje de error o ''
        const errorCantidad = (valor, min = 0) => {
            if (String(valor).trim() === '') return 'Escribe una cantidad.';
            const n = Number(valor);
            if (!Number.isInteger(n)) return 'Usa un número entero, sin decimales.';
            if (n < min) return min === 0 ? 'La cantidad no puede ser negativa.' : `La cantidad mínima es ${min}.`;
            if (n > CANTIDAD_MAX) return `La cantidad máxima es ${fmt(CANTIDAD_MAX)}.`;
            return '';
        };

        const insertAt = (arr, index, el) => [...arr.slice(0, index), el, ...arr.slice(index)];

        // La rueda del mouse no debe cambiar una cantidad sin querer
        const sinRueda = (e) => e.currentTarget.blur();

        // Mueve el foco a un elemento cuando React ya lo pintó
        const enfocar = (selector, respaldo) => requestAnimationFrame(() => {
            const el = document.querySelector(selector) || (respaldo && document.querySelector(respaldo));
            el?.focus();
        });

        // Datos de ejemplo para la demo (CU-04 al CU-37)
        const INVENTARIO_INICIAL = [
            { id: 1, categoria: 'Herramienta', nombre: 'Taladro percutor', ubicacion: 'Estante A-1', cantidad: 4 },
            { id: 2, categoria: 'Material', nombre: 'Tornillos de madera 2"', ubicacion: 'Caja B-3', cantidad: 150 },
            { id: 3, categoria: 'Herramienta', nombre: 'Sierra circular', ubicacion: 'Estante A-2', cantidad: 2 },
            { id: 4, categoria: 'Material', nombre: 'Pegamento de contacto', ubicacion: 'Estante C-1', cantidad: 8 },
            { id: 5, categoria: 'Material', nombre: 'Lija grano 120', ubicacion: 'Estante C-4', cantidad: 0 },
        ];
        const LISTAS_INICIALES = [
            { id: 1, nombre: 'Kit de mantenimiento general', items: [ { id: 1, cantidadNecesaria: 1 }, { id: 2, cantidadNecesaria: 40 } ] },
            { id: 2, nombre: 'Mueble de cocina', items: [ { id: 2, cantidadNecesaria: 200 }, { id: 4, cantidadNecesaria: 2 }, { id: 5, cantidadNecesaria: 6 } ] },
        ];
        const PROYECTOS_INICIALES = [
            { id: 101, nombre: 'Instalación de alacena y gabinete', responsable: 'Carlos Méndez', listId: 2, estado: 'Pendiente', avance: 20, nota: 'A la espera de reponer lija y tornillos de 2" en bodega.' },
            { id: 102, nombre: 'Mantenimiento preventivo de bancos', responsable: 'Ana Vargas', listId: 1, estado: 'En curso', avance: 65, nota: 'Revisión de prensas y ajuste de mesas de corte del taller.' },
        ];

        // Estado que sobrevive a recargar la página; si el navegador bloquea el almacenamiento, sigue en memoria
        function usePersistentState(clave, inicial) {
            const [valor, setValor] = React.useState(() => {
                try {
                    const guardado = localStorage.getItem(clave);
                    return guardado ? JSON.parse(guardado) : inicial;
                } catch { return inicial; }
            });
            React.useEffect(() => {
                try { localStorage.setItem(clave, JSON.stringify(valor)); } catch {}
            }, [clave, valor]);
            return [valor, setValor];
        }

        // ¿Pantalla de celular? Cambia cómo se muestran avisos y editores en línea
        const MQ_ANGOSTA = '(max-width: 639px)';
        const esAngosta = () => { try { return window.matchMedia(MQ_ANGOSTA).matches; } catch { return false; } };
        function useAngosta() {
            const [angosta, setAngosta] = React.useState(esAngosta);
            React.useEffect(() => {
                const mq = window.matchMedia(MQ_ANGOSTA);
                const onChange = () => setAngosta(mq.matches);
                mq.addEventListener('change', onChange);
                return () => mq.removeEventListener('change', onChange);
            }, []);
            return angosta;
        }

        // Editor de una cantidad. En celular va apilado en su propia fila para que nada quede fuera de pantalla
        function EditorCantidad({ id, label, value, error, min, onChange, onSubmit, onCancel, apilado }) {
            return (
                <form onSubmit={onSubmit} noValidate onKeyDown={(e) => { if (e.key === 'Escape') { e.stopPropagation(); onCancel(); } }} className={apilado ? 'flex flex-col gap-2' : 'inline-flex flex-col items-end gap-1'}>
                    <label htmlFor={id} className={apilado ? 'text-sm font-semibold text-ink' : 'sr-only'}>{label}</label>
                    <div className={apilado ? 'flex flex-col gap-2' : 'flex items-center gap-1'}>
                        <input id={id} type="number" inputMode="numeric" min={min} max={CANTIDAD_MAX} step="1" autoFocus onWheel={sinRueda} value={value} onChange={onChange} aria-invalid={!!error} aria-describedby={error ? `${id}-err` : undefined} className={`${apilado ? 'w-full' : 'w-24'} min-h-[2.5rem] px-2 border rounded-lg text-base md:text-sm font-mono text-right bg-surface focus:outline-none focus:ring-2 focus:ring-link ${borde(error)}`} />
                        <div className={apilado ? 'grid grid-cols-2 gap-2' : 'flex items-center gap-1'}>
                            <button type="button" onClick={onCancel} className={`${BTN_SECUNDARIO} px-3`}>Cancelar</button>
                            <button type="submit" className={`${BTN_PRIMARIO} px-3`}>Guardar</button>
                        </div>
                    </div>
                    <FieldError id={`${id}-err`}>{error}</FieldError>
                </form>
            );
        }

        // Íconos dibujados con un solo trazo y grosor
        const ICONOS = {
            caja: 'M21 8l-9-5-9 5v8l9 5 9-5V8z M3 8l9 5 9-5 M12 13v8',
            lista: 'M9 3h6v3H9z M9 4.5H6.5A1.5 1.5 0 005 6v13.5A1.5 1.5 0 006.5 21h11a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H15 M9 11.5l1.5 1.5L13 10.5 M9 16.5h6',
            carpeta: 'M3 7.5A1.5 1.5 0 014.5 6h4l2 2h9A1.5 1.5 0 0121 9.5v8a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 17.5z',
            llave: 'M14.5 6.5a4 4 0 00-5.2 5.2L3.5 17.5l3 3 5.8-5.8a4 4 0 005.2-5.2l-2.7 2.7-2.3-.7-.7-2.3z',
            mas: 'M12 5v14 M5 12h14',
            buscar: 'M11 18a7 7 0 100-14 7 7 0 000 14z M20 20l-4-4',
            salir: 'M15 4h3.5A1.5 1.5 0 0120 5.5v13a1.5 1.5 0 01-1.5 1.5H15 M10 16l4-4-4-4 M14 12H4',
            check: 'M5 12.5l4.5 4.5L19 7.5',
            alerta: 'M12 4l9 16H3z M12 10v4 M12 17h.01',
            x: 'M6 6l12 12M18 6L6 18',
            flechaIzq: 'M15 18l-6-6 6-6',
            flechaDer: 'M9 18l6-6-6-6',
            lapiz: 'M4 20h4L19 9l-4-4L4 16v4z M13.5 6.5l4 4',
            basura: 'M4 7h16 M10 11v6 M14 11v6 M6 7l1 13h10l1-13 M9 7V4h6v3',
            orden: 'M8 9l4-4 4 4 M8 15l4 4 4-4',
            ordenAsc: 'M7 14l5-5 5 5',
            ordenDesc: 'M7 10l5 5 5-5',
        };

        function Icon({ name, className = 'w-5 h-5', strokeWidth = 1.8 }) {
            return (
                <svg viewBox="0 0 24 24" className={className} fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                    <path d={ICONOS[name]} />
                </svg>
            );
        }

        // Botones: un solo sistema de tamaños para toda la app con feedback físico scale(0.97)
        const BTN = 'btn-press inline-flex items-center justify-center gap-1.5 rounded-xl text-sm font-semibold whitespace-nowrap min-h-[2.5rem] px-4';
        const BTN_PRIMARIO = `${BTN} bg-action text-action-ink hover:bg-action-hover`;
        const BTN_SECUNDARIO = `${BTN} bg-surface text-ink border border-line-strong hover:bg-canvas`;
        const BTN_PELIGRO = `${BTN} px-3 text-muted hover:text-err-strong hover:bg-err-soft`;
        const ENLACE = 'inline-flex items-center gap-1 text-sm font-semibold text-link hover:text-link-hover underline-offset-4 hover:underline';

        const CAMPO = 'w-full min-h-[2.5rem] px-3 py-2 border rounded-xl text-base md:text-sm bg-surface focus:outline-none focus:ring-2 focus:ring-link';
        const borde = (error) => error ? 'border-err' : 'border-line-strong';
        const ETIQUETA = 'block text-sm font-semibold text-ink mb-1';

        // Estado de stock en bodega: texto + ícono, no solo color
        const stockStatus = (cantidad) => {
            if (cantidad <= 0) return { label: 'Agotado', cls: 'bg-err-soft text-err-strong', icon: 'x' };
            if (cantidad <= STOCK_BAJO) return { label: 'Bajo', cls: 'bg-warn-soft text-warn', icon: 'alerta' };
            return { label: 'Suficiente', cls: 'bg-ok-soft text-ok', icon: 'check' };
        };

        function Badge({ cls, icon, children }) {
            return (
                <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap ${cls}`}>
                    <Icon name={icon} className="w-3.5 h-3.5" strokeWidth={2.4} />
                    {children}
                </span>
            );
        }

        const StockBadge = ({ cantidad }) => {
            const s = stockStatus(cantidad);
            return <Badge cls={s.cls} icon={s.icon}>{s.label}</Badge>;
        };

        function FieldError({ id, children }) {
            if (!children) return null;
            return <p id={id} className="mt-1 text-sm font-medium text-err-strong">{children}</p>;
        }

        // Avisos tras cada acción: se apilan (hasta 3), cada uno con su tiempo, y se pausan al pasar el mouse o enfocar
        function ToastItem({ toast, onDismiss }) {
            const [pausado, setPausado] = React.useState(false);
            const ref = React.useRef(null);
            // Si el foco estaba en el aviso, lo devolvemos a lo restaurado o al título de la sección
            const devolverFoco = (destino) => {
                if (ref.current && ref.current.contains(document.activeElement)) enfocar(destino || 'main h1', 'main h1');
            };
            React.useEffect(() => {
                if (pausado) return;
                const t = setTimeout(() => onDismiss(toast.key), toast.action ? 8000 : 4000);
                return () => clearTimeout(t);
            }, [pausado, toast.key]);
            return (
                <div
                    ref={ref}
                    className="toast-in pointer-events-auto flex items-center gap-2 w-full sm:w-auto sm:max-w-md bg-brand text-white pl-4 pr-1.5 py-1.5 rounded-xl shadow-[0_10px_28px_-10px_oklch(0.24_0.015_260/0.55)]"
                    onMouseEnter={() => setPausado(true)} onMouseLeave={() => setPausado(false)}
                    onFocus={() => setPausado(true)} onBlur={() => setPausado(false)}
                >
                    <p className="flex-1 text-sm py-1.5 [overflow-wrap:anywhere]">{toast.message}</p>
                    {toast.action && (
                        <button type="button" onClick={() => { toast.action.run(); devolverFoco(toast.action.focusAfter); onDismiss(toast.key); }} className="shrink-0 min-h-[2.5rem] px-3 rounded-lg text-sm font-bold text-action-on-dark hover:bg-brand-raised">{toast.action.label}</button>
                    )}
                    <button type="button" onClick={() => { devolverFoco(); onDismiss(toast.key); }} aria-label="Cerrar aviso" className="shrink-0 w-10 h-10 rounded-lg text-brand-ink hover:bg-brand-raised flex items-center justify-center">
                        <Icon name="x" className="w-4 h-4" strokeWidth={2} />
                    </button>
                </div>
            );
        }

        function Toasts({ toasts, onDismiss }) {
            return (
                <div id="avisos" role="status" aria-live="polite" className="fixed bottom-4 inset-x-4 sm:inset-x-auto sm:right-6 z-50 flex flex-col items-stretch sm:items-end gap-2 pointer-events-none">
                    {toasts.map(t => <ToastItem key={t.key} toast={t} onDismiss={onDismiss} />)}
                </div>
            );
        }

        // Cálculo central del producto: ¿alcanza lo que hay en bodega para esta lista?
        function revisarLista(lista, inventory) {
            const filas = lista.items
                .map(it => {
                    const inv = inventory.find(i => i.id === it.id);
                    if (!inv) return null;
                    const falta = Math.max(0, it.cantidadNecesaria - inv.cantidad);
                    return { ...inv, necesito: it.cantidadNecesaria, falta };
                })
                .filter(Boolean);
            const faltantes = filas.filter(f => f.falta > 0);
            return { filas, faltantes, lista: filas.length > 0 && faltantes.length === 0 };
        }

        function ResumenBadge({ revision }) {
            if (revision.filas.length === 0) return <Badge cls="bg-canvas text-muted border border-line" icon="lista">Sin materiales</Badge>;
            if (revision.lista) return <Badge cls="bg-ok-soft text-ok" icon="check">Puedes empezar</Badge>;
            const n = revision.faltantes.length;
            return <Badge cls="bg-err-soft text-err-strong" icon="alerta">{n === 1 ? 'Falta 1 material' : `Faltan ${fmt(n)} materiales`}</Badge>;
        }

        // Texto corto de lo que falta: "Tornillos de madera 2" (50) · Lija grano 120 (6)"
        const textoFaltantes = (faltantes) => faltantes.map(f => `${f.nombre} (${fmt(f.falta)})`).join(' · ');

        const PESTANAS = [
            { id: 'listas', label: 'Listas', icon: 'lista' },
            { id: 'inventario', label: 'Inventario', icon: 'caja' },
            { id: 'proyectos', label: 'Proyectos', icon: 'carpeta' },
        ];

        function App() {
            // Autenticación (CU-01, CU-03)
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [showPassword, setShowPassword] = React.useState(false);
            const [errorMessage, setErrorMessage] = React.useState('');
            const [loginErrorField, setLoginErrorField] = React.useState(null); // 'user' | 'pass' | 'both'
            const angosta = useAngosta();
            const [activeUser, setActiveUser] = React.useState('');

            const [activeModule, setActiveModule] = React.useState('listas');

            // Inventario (CU-04 al CU-13)
            const [inventory, setInventory] = usePersistentState('hm-inventario', INVENTARIO_INICIAL);
            const [showAddItem, setShowAddItem] = React.useState(false);
            const [newCategory, setNewCategory] = React.useState('Herramienta');
            const [newName, setNewName] = React.useState('');
            const [newLocation, setNewLocation] = React.useState('');
            const [newQuantity, setNewQuantity] = React.useState('');
            const [itemErrors, setItemErrors] = React.useState({});
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterCategory, setFilterCategory] = React.useState('Todos');
            const [editing, setEditing] = React.useState(null); // { id, value, error } al ajustar una cantidad

            // Listas de materiales (CU-14 al CU-18)
            const [lists, setLists] = usePersistentState('hm-listas', LISTAS_INICIALES);
            const [newListName, setNewListName] = React.useState('');
            const [listNameError, setListNameError] = React.useState('');
            const [showAddList, setShowAddList] = React.useState(false);
            const [selectedListId, setSelectedListId] = React.useState(null);
            const [itemToAddId, setItemToAddId] = React.useState('');
            const [needQty, setNeedQty] = React.useState('1');
            const [addErrors, setAddErrors] = React.useState({});
            const [editingNeed, setEditingNeed] = React.useState(null); // { id, value, error }
            const [editingListTitle, setEditingListTitle] = React.useState(null); // { value, error }
            const [editingItem, setEditingItem] = React.useState(null); // { id, categoria, nombre, ubicacion, errors }

            // Proyectos del taller (CU-19 al CU-37)
            const [projects, setProjects] = usePersistentState('hm-proyectos', PROYECTOS_INICIALES);
            const [showAddProject, setShowAddProject] = React.useState(false);
            const [newProjName, setNewProjName] = React.useState('');
            const [newProjResp, setNewProjResp] = React.useState('');
            const [newProjListId, setNewProjListId] = React.useState('');
            const [newProjNote, setNewProjNote] = React.useState('');
            const [projErrors, setProjErrors] = React.useState({});
            const [filterProjState, setFilterProjState] = React.useState('Todos');

            const [toasts, setToasts] = React.useState([]);
            const [sort, setSort] = React.useState({ col: null, dir: 'asc' }); // orden de la tabla de inventario

            // IDs que no chocan: siempre por encima del mayor existente
            const idRef = React.useRef(0);
            const nuevoId = () => {
                const max = Math.max(0, ...inventory.map(i => i.id), ...lists.map(l => l.id), ...projects.map(p => p.id));
                idRef.current = Math.max(idRef.current, max) + 1;
                return idRef.current;
            };

            // La lista abierta se deriva de `lists`, así nunca queda desactualizada
            const selectedList = lists.find(l => l.id === selectedListId) || null;

            const searchRef = React.useRef(null);
            const firstItemFieldRef = React.useRef(null);
            const listNameRef = React.useRef(null);
            const mainRef = React.useRef(null);

            React.useEffect(() => { if (showAddItem) firstItemFieldRef.current?.focus(); }, [showAddItem]);
            React.useEffect(() => { if (showAddList) listNameRef.current?.focus(); }, [showAddList]);

            // Atajo: "/" enfoca la búsqueda del inventario
            React.useEffect(() => {
                const onKey = (e) => {
                    if (e.key !== '/' || ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
                    if (activeModule === 'inventario') { e.preventDefault(); searchRef.current?.focus(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [activeModule]);

            const showToast = (message, action) => setToasts(prev => [...prev, { message, action, key: Date.now() + Math.random() }].slice(esAngosta() ? -1 : -3));
            const dismissToast = (key) => setToasts(prev => prev.filter(t => t.key !== key));

            const goTo = (modulo) => {
                setActiveModule(modulo);
                setSelectedListId(null);
                setEditing(null);
                setEditingNeed(null);
                setEditingListTitle(null);
                setEditingItem(null);
                setToasts(prev => prev.filter(t => t.action));
                // Al cambiar de sección, el foco va a su título (lectores de pantalla lo anuncian)
                enfocar('main h1');
            };

            const jumpToInventoryItem = (item) => {
                setActiveModule('inventario');
                setSelectedListId(null);
                setSearchTerm(item.nombre);
                setFilterCategory('Todos');
                setEditing({ id: item.id, value: String(item.cantidad), error: '' });
                enfocar(`#qty-${item.id}`, '#inv-search');
            };

            const saveItemDetails = (e) => {
                e.preventDefault();
                if (!editingItem) return;
                const nombre = editingItem.nombre.trim();
                const ubicacion = editingItem.ubicacion.trim();
                const errors = {};
                if (!nombre) errors.nombre = 'Escribe el nombre del ítem.';
                else if (inventory.some(i => i.id !== editingItem.id && normalizar(i.nombre) === normalizar(nombre)))
                    errors.nombre = `"${nombre}" ya está en el inventario.`;
                if (!ubicacion) errors.ubicacion = 'Indica dónde se guarda, por ejemplo Estante A-1.';
                if (Object.keys(errors).length) {
                    setEditingItem({ ...editingItem, errors });
                    enfocar(errors.nombre ? `#edit-name-${editingItem.id}` : `#edit-loc-${editingItem.id}`);
                    return;
                }
                const itemId = editingItem.id;
                setInventory(prev => prev.map(i => i.id === itemId ? { ...i, categoria: editingItem.categoria, nombre, ubicacion } : i));
                setEditingItem(null);
                enfocar(`[data-edit-item="${itemId}"]`);
                showToast(`Actualizaste los datos de "${nombre}".`);
            };

            const saveListTitle = (e) => {
                e.preventDefault();
                if (!editingListTitle || !selectedList) return;
                const nombre = editingListTitle.value.trim();
                if (!nombre) {
                    setEditingListTitle({ ...editingListTitle, error: 'Escribe un nombre para la lista.' });
                    enfocar('#edit-list-title');
                    return;
                }
                if (lists.some(l => l.id !== selectedList.id && normalizar(l.nombre) === normalizar(nombre))) {
                    setEditingListTitle({ ...editingListTitle, error: `Ya tienes una lista llamada "${nombre}".` });
                    enfocar('#edit-list-title');
                    return;
                }
                setLists(prev => prev.map(l => l.id === selectedList.id ? { ...l, nombre } : l));
                setEditingListTitle(null);
                enfocar('#btn-rename-list');
                showToast(`Renombraste la lista a "${nombre}".`);
            };

            const handleCreateProject = (e) => {
                e.preventDefault();
                const nombre = newProjName.trim();
                const responsable = newProjResp.trim();
                const nota = newProjNote.trim();
                const errors = {};
                if (!nombre) errors.nombre = 'Escribe el nombre del trabajo o proyecto.';
                else if (projects.some(p => normalizar(p.nombre) === normalizar(nombre)))
                    errors.nombre = `Ya existe un proyecto llamado "${nombre}".`;
                if (!responsable) errors.responsable = 'Indica quién está a cargo.';
                setProjErrors(errors);
                if (Object.keys(errors).length) {
                    enfocar(errors.nombre ? '#proj-name' : '#proj-resp');
                    return;
                }
                const nuevo = {
                    id: nuevoId(),
                    nombre,
                    responsable,
                    listId: newProjListId ? Number(newProjListId) : null,
                    estado: 'Pendiente',
                    avance: 0,
                    nota: nota || 'Sin notas adicionales.',
                };
                setProjects(prev => [nuevo, ...prev]);
                setNewProjName(''); setNewProjResp(''); setNewProjListId(''); setNewProjNote('');
                setProjErrors({});
                setShowAddProject(false);
                showToast(`Registraste el proyecto "${nombre}".`);
            };

            const handleUpdateProjectState = (proj, nuevoEstado) => {
                const nuevoAvance = nuevoEstado === 'Terminado' ? 100 : nuevoEstado === 'Pendiente' ? 0 : Math.max(15, proj.avance === 100 ? 50 : proj.avance);
                setProjects(prev => prev.map(p => p.id === proj.id ? { ...p, estado: nuevoEstado, avance: nuevoAvance } : p));
                showToast(`"${proj.nombre}" pasó a ${nuevoEstado.toLowerCase()} (${nuevoAvance}%).`);
            };

            const handleStepProjectProgress = (proj, delta) => {
                const siguiente = Math.max(0, Math.min(100, proj.avance + delta));
                const nuevoEstado = siguiente === 100 ? 'Terminado' : siguiente === 0 ? 'Pendiente' : 'En curso';
                setProjects(prev => prev.map(p => p.id === proj.id ? { ...p, avance: siguiente, estado: nuevoEstado } : p));
                showToast(`Avance de "${proj.nombre}": ${siguiente}%.`);
            };

            const handleDeleteProject = (proj) => {
                const index = projects.findIndex(p => p.id === proj.id);
                setProjects(prev => prev.filter(p => p.id !== proj.id));
                enfocar('#proj-title');
                showToast(`Eliminaste el proyecto "${proj.nombre}".`, {
                    label: 'Deshacer',
                    focusAfter: `[data-del-proj="${proj.id}"]`,
                    run: () => setProjects(prev => prev.some(p => p.id === proj.id) ? prev : insertAt(prev, Math.min(index, prev.length), proj))
                });
            };

            const handleResetDemo = () => {
                const prevInv = inventory;
                const prevLists = lists;
                const prevProjs = projects;
                setInventory(INVENTARIO_INICIAL);
                setLists(LISTAS_INICIALES);
                setProjects(PROYECTOS_INICIALES);
                setSelectedListId(null);
                setEditing(null);
                setEditingNeed(null);
                setEditingItem(null);
                setEditingListTitle(null);
                setSearchTerm('');
                setFilterCategory('Todos');
                showToast('Restauraste los datos de demostración del taller.', {
                    label: 'Deshacer',
                    run: () => { setInventory(prevInv); setLists(prevLists); setProjects(prevProjs); }
                });
            };

            const openList = (id) => {
                setSelectedListId(id);
                setAddErrors({});
                setItemToAddId('');
                setNeedQty('1');
                setEditingNeed(null);
                requestAnimationFrame(() => mainRef.current?.querySelector('h1')?.focus());
            };

            // Al volver al índice, el foco regresa a la lista de la que venías
            const closeList = () => {
                const id = selectedListId;
                setSelectedListId(null);
                enfocar(`[data-list-open="${id}"]`, '#lists-title');
            };

            // Inicio de sesión (CU-01)
            const handleLogin = (e) => {
                e.preventDefault();
                if (!username.trim() || !password) {
                    setLoginErrorField(!username.trim() && !password ? 'both' : !username.trim() ? 'user' : 'pass');
                    setErrorMessage(!username.trim() && !password ? 'Escribe tu usuario y tu contraseña para entrar.' : !username.trim() ? 'Escribe tu usuario para entrar.' : 'Escribe tu contraseña para entrar.');
                    enfocar(!username.trim() ? '#login-user' : '#login-pass');
                    return;
                }
                if (username.trim() === 'admin' && password === '12345') {
                    setIsLoggedIn(true);
                    setActiveUser(username.trim());
                    setErrorMessage('');
                    setLoginErrorField(null);
                    goTo('listas');
                } else {
                    setLoginErrorField('both');
                    setErrorMessage('El usuario o la contraseña no coinciden. Revísalos e intenta de nuevo.');
                    setPassword('');
                    enfocar('#login-pass');
                }
            };

            // Cierre de sesión (CU-02)
            const handleLogout = () => {
                setIsLoggedIn(false);
                setUsername('');
                setPassword('');
                setShowPassword(false);
                goTo('listas');
            };

            // Inventario: registrar ítem
            const handleAddItem = (e) => {
                e.preventDefault();
                const nombre = newName.trim();
                const ubicacion = newLocation.trim();
                const errors = {};
                if (!nombre) errors.nombre = 'Escribe el nombre del ítem.';
                else if (inventory.some(i => normalizar(i.nombre) === normalizar(nombre)))
                    errors.nombre = `"${nombre}" ya está en el inventario. Ajusta su cantidad en la tabla.`;
                if (!ubicacion) errors.ubicacion = 'Indica dónde se guarda, por ejemplo Estante A-1.';
                const qtyError = errorCantidad(newQuantity);
                if (qtyError) errors.cantidad = qtyError;
                setItemErrors(errors);
                if (Object.keys(errors).length) {
                    enfocar(errors.nombre ? '#item-name' : errors.ubicacion ? '#item-loc' : '#item-qty');
                    return;
                }

                const newItem = { id: nuevoId(), categoria: newCategory, nombre, ubicacion, cantidad: Number(newQuantity) };
                setInventory(prev => [newItem, ...prev]);
                setNewName(''); setNewLocation(''); setNewQuantity('');
                setShowAddItem(false);
                showToast(`Agregaste "${nombre}" al inventario.`);
            };

            const closeAddItem = () => { setShowAddItem(false); setItemErrors({}); enfocar('#btn-add-item'); };
            const cancelEdit = () => { const id = editing?.id; setEditing(null); enfocar(`[data-qty="${id}"]`); };
            const cancelEditItem = () => { const id = editingItem?.id; setEditingItem(null); enfocar(`[data-edit-item="${id}"]`); };

            // Eliminar ítem: sin diálogo, con "Deshacer" que reinserta solo lo borrado
            const handleDeleteItem = (item) => {
                const index = inventory.findIndex(i => i.id === item.id);
                const enListas = lists.flatMap(l => {
                    const j = l.items.findIndex(i => i.id === item.id);
                    return j >= 0 ? [{ listId: l.id, entry: l.items[j], index: j }] : [];
                });
                const visibles = sortedInventory.map(i => i.id);
                const pos = visibles.indexOf(item.id);
                const siguiente = visibles[pos + 1] ?? visibles[pos - 1];

                setInventory(prev => prev.filter(i => i.id !== item.id));
                setLists(prev => prev.map(l => ({ ...l, items: l.items.filter(i => i.id !== item.id) })));
                enfocar(`[data-del="${siguiente}"]`, '#inv-title');
                showToast(
                    enListas.length ? `Eliminaste "${item.nombre}" y lo quitaste de ${plural(enListas.length, 'lista', 'listas')}.` : `Eliminaste "${item.nombre}".`,
                    {
                        label: 'Deshacer',
                        focusAfter: `[data-del="${item.id}"]`,
                        run: () => {
                            setInventory(prev => prev.some(i => i.id === item.id) ? prev : insertAt(prev, Math.min(index, prev.length), item));
                            setLists(prev => prev.map(l => {
                                const r = enListas.find(e => e.listId === l.id);
                                return r && !l.items.some(i => i.id === item.id) ? { ...l, items: insertAt(l.items, Math.min(r.index, l.items.length), r.entry) } : l;
                            }));
                        }
                    }
                );
            };

            const saveEdit = (e) => {
                e.preventDefault();
                const error = errorCantidad(editing.value);
                if (error) { setEditing({ ...editing, error }); return; }
                const item = inventory.find(i => i.id === editing.id);
                const nueva = Number(editing.value);
                setInventory(prev => prev.map(i => i.id === editing.id ? { ...i, cantidad: nueva } : i));
                enfocar(`[data-qty="${editing.id}"]`);
                setEditing(null);
                if (item) showToast(`"${item.nombre}" ahora tiene ${fmt(nueva)} en bodega.`);
            };

            const filteredInventory = inventory.filter(item => {
                const q = normalizar(searchTerm);
                const matchesSearch = !q || normalizar(item.nombre).includes(q) || normalizar(item.ubicacion).includes(q);
                const matchesCategory = filterCategory === 'Todos'
                    || (filterCategory === 'Bajo' ? item.cantidad <= STOCK_BAJO : item.categoria === filterCategory);
                return matchesSearch && matchesCategory;
            });
            const hayFiltros = searchTerm.trim() !== '' || filterCategory !== 'Todos';

            // Orden por columna (Nombre o En bodega); sin orden, se respeta el de registro
            const sortedInventory = sort.col ? [...filteredInventory].sort((a, b) => {
                const v = sort.col === 'nombre' ? a.nombre.localeCompare(b.nombre, 'es') : a.cantidad - b.cantidad;
                return sort.dir === 'asc' ? v : -v;
            }) : filteredInventory;
            const toggleSort = (col) => setSort(prev => prev.col === col ? { col, dir: prev.dir === 'asc' ? 'desc' : 'asc' } : { col, dir: 'asc' });
            const ariaSort = (col) => sort.col === col ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';

            const descripcionFiltro = [
                searchTerm.trim() && `"${searchTerm.trim()}"`,
                filterCategory === 'Herramienta' && 'herramientas',
                filterCategory === 'Material' && 'materiales',
                filterCategory === 'Bajo' && 'stock bajo o agotado',
            ].filter(Boolean).join(' en ');
            const conStockBajo = inventory.filter(i => i.cantidad <= STOCK_BAJO).length;

            // Listas: crear (CU-14)
            const handleCreateList = (e) => {
                e.preventDefault();
                const nombre = newListName.trim();
                if (!nombre) { setListNameError('Escribe un nombre para la lista.'); enfocar('#list-name'); return; }
                // Nombre único (CU-14, E1)
                if (lists.some(l => normalizar(l.nombre) === normalizar(nombre))) {
                    setListNameError(`Ya tienes una lista llamada "${nombre}". Usa otro nombre.`);
                    enfocar('#list-name');
                    return;
                }
                const id = nuevoId();
                setLists(prev => [...prev, { id, nombre, items: [] }]);
                setNewListName('');
                setListNameError('');
                setShowAddList(false);
                showToast(`Creaste la lista "${nombre}".`);
                openList(id);
            };

            const closeAddList = () => { setShowAddList(false); setListNameError(''); enfocar('#btn-add-list'); };
            const cancelNeed = () => { const id = editingNeed?.id; setEditingNeed(null); enfocar(`[data-need="${id}"]`); };
            const cancelListTitle = () => { setEditingListTitle(null); enfocar('#btn-rename-list'); };
            const closeAddProject = () => { setShowAddProject(false); setProjErrors({}); enfocar('#btn-add-project'); };

            const handleDeleteList = (list) => {
                const index = lists.findIndex(l => l.id === list.id);
                const siguiente = lists[index + 1]?.id ?? lists[index - 1]?.id;
                setLists(prev => prev.filter(l => l.id !== list.id));
                if (selectedListId === list.id) setSelectedListId(null);
                enfocar(`[data-list-open="${siguiente}"]`, '#lists-title');
                showToast(`Eliminaste la lista "${list.nombre}".`, {
                    label: 'Deshacer',
                    focusAfter: `[data-list-open="${list.id}"]`,
                    run: () => setLists(prev => prev.some(l => l.id === list.id) ? prev : insertAt(prev, Math.min(index, prev.length), list))
                });
            };

            // Ítems del inventario que todavía no están en la lista abierta
            const disponibles = selectedList ? inventory.filter(inv => !selectedList.items.some(i => i.id === inv.id)) : [];

            // Listas: agregar ítem con cantidad necesaria (CU-16)
            const handleAddToList = (e) => {
                e.preventDefault();
                if (!selectedList) return;
                const errors = {};
                const itemToAdd = inventory.find(i => i.id === Number(itemToAddId));
                if (!itemToAddId) errors.item = 'Elige un material del inventario.';
                else if (!itemToAdd) errors.item = 'Ese material ya no está en el inventario.';
                // Ya está en la lista (CU-16, E1)
                else if (selectedList.items.some(i => i.id === itemToAdd.id)) errors.item = `"${itemToAdd.nombre}" ya está en esta lista.`;
                const qtyError = errorCantidad(needQty, 1);
                if (qtyError) errors.cantidad = qtyError;
                setAddErrors(errors);
                if (Object.keys(errors).length) {
                    enfocar(errors.item ? '#list-add' : '#list-need');
                    return;
                }

                const necesito = Number(needQty);
                setLists(prev => prev.map(l => l.id === selectedList.id
                    ? { ...l, items: [...l.items, { id: itemToAdd.id, cantidadNecesaria: necesito }] }
                    : l));
                setItemToAddId('');
                setNeedQty('1');
                const falta = Math.max(0, necesito - itemToAdd.cantidad);
                showToast(falta ? `Agregaste "${itemToAdd.nombre}". Faltan ${fmt(falta)} en bodega.` : `Agregaste "${itemToAdd.nombre}". Hay suficiente en bodega.`);
                enfocar('#list-add', '#list-title');
            };

            const saveNeed = (e) => {
                e.preventDefault();
                const error = errorCantidad(editingNeed.value, 1);
                if (error) { setEditingNeed({ ...editingNeed, error }); return; }
                const listId = selectedList.id;
                const nueva = Number(editingNeed.value);
                const item = inventory.find(i => i.id === editingNeed.id);
                setLists(prev => prev.map(l => l.id === listId
                    ? { ...l, items: l.items.map(i => i.id === editingNeed.id ? { ...i, cantidadNecesaria: nueva } : i) }
                    : l));
                enfocar(`[data-need="${editingNeed.id}"]`);
                setEditingNeed(null);
                if (item) showToast(`Ahora necesitas ${fmt(nueva)} de "${item.nombre}".`);
            };

            const handleRemoveFromList = (fila) => {
                const listId = selectedList.id;
                const index = selectedList.items.findIndex(i => i.id === fila.id);
                const entry = selectedList.items[index];
                const ids = revisarLista(selectedList, inventory).filas.map(f => f.id);
                const pos = ids.indexOf(fila.id);
                const siguiente = ids[pos + 1] ?? ids[pos - 1];
                setLists(prev => prev.map(l => l.id === listId ? { ...l, items: l.items.filter(i => i.id !== fila.id) } : l));
                enfocar(`[data-quitar="${siguiente}"]`, '#list-add');
                showToast(`Quitaste "${fila.nombre}" de la lista.`, {
                    label: 'Deshacer',
                    focusAfter: `[data-quitar="${fila.id}"]`,
                    run: () => setLists(prev => prev.map(l => l.id === listId && !l.items.some(i => i.id === fila.id)
                        ? { ...l, items: insertAt(l.items, Math.min(index, l.items.length), entry) }
                        : l))
                });
            };

            const toastEl = <Toasts toasts={toasts} onDismiss={dismissToast} />;

            // ---------- Pantalla de inicio de sesión ----------
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-canvas px-4 py-10">
                        <main className="max-w-sm w-full">
                            <div className="flex items-center gap-3 mb-8">
                                <span className="w-11 h-11 rounded-xl bg-brand text-action flex items-center justify-center">
                                    <Icon name="llave" className="w-6 h-6" />
                                </span>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-ink tracking-tight leading-tight">¿Hay materiales?</h1>
                                    <p className="text-sm text-muted">Inventario y listas del taller</p>
                                </div>
                            </div>

                            <form onSubmit={handleLogin} noValidate className="bg-surface border border-line rounded-2xl p-6 space-y-5">
                                {errorMessage && (
                                    <div id="login-error" role="alert" className="flex gap-2 p-3 bg-err-soft border border-err-soft-hover text-err-strong text-sm rounded-xl">
                                        <Icon name="alerta" className="w-5 h-5 shrink-0" />
                                        <span>{errorMessage}</span>
                                    </div>
                                )}
                                <div>
                                    <label htmlFor="login-user" className={ETIQUETA}>Usuario</label>
                                    <input
                                        id="login-user"
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        required
                                        autoFocus
                                        autoComplete="username"
                                        autoCapitalize="none"
                                        spellCheck="false"
                                        maxLength={40}
                                        aria-invalid={loginErrorField === 'user' || loginErrorField === 'both'}
                                        aria-describedby={errorMessage ? 'login-error' : undefined}
                                        className={`${CAMPO} ${borde(loginErrorField === 'user' || loginErrorField === 'both')}`}
                                    />
                                </div>
                                <div>
                                    <label htmlFor="login-pass" className={ETIQUETA}>Contraseña</label>
                                    <div className="relative">
                                        <input
                                            id="login-pass"
                                            type={showPassword ? 'text' : 'password'}
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            required
                                            autoComplete="current-password"
                                            maxLength={64}
                                            aria-invalid={loginErrorField === 'pass' || loginErrorField === 'both'}
                                            aria-describedby={errorMessage ? 'login-error' : undefined}
                                            className={`${CAMPO} ${borde(loginErrorField === 'pass' || loginErrorField === 'both')} pr-24`}
                                        />
                                        <button
                                            type="button"
                                            onClick={() => setShowPassword(!showPassword)}
                                            aria-pressed={showPassword}
                                            className="absolute inset-y-0 right-0 px-3 my-1 mr-1 rounded-lg text-sm font-semibold text-link hover:bg-canvas"
                                        >
                                            {showPassword ? 'Ocultar' : 'Mostrar'}
                                        </button>
                                    </div>
                                </div>
                                <button type="submit" className={`${BTN_PRIMARIO} w-full min-h-[2.75rem] text-base font-bold`}>Entrar</button>
                            </form>
                            <p className="mt-4 text-center text-sm text-muted">Acceso de prueba: <b className="text-ink">admin</b> / <b className="text-ink">12345</b></p>
                        </main>
                        {toastEl}
                    </div>
                );
            }

            // ---------- Aplicación ----------
            return (
                <div className="min-h-screen bg-canvas flex flex-col">
                    <a href="#contenido" className="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 focus:bg-surface focus:px-3 focus:py-2 focus:rounded-lg">Saltar al contenido</a>
                    <header className="sticky top-0 z-30 bg-surface/95 backdrop-blur-md border-b border-line-strong">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-6 min-w-0">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <span className="w-9 h-9 rounded-xl bg-brand text-action flex items-center justify-center shrink-0">
                                        <Icon name="llave" className="w-5 h-5" />
                                    </span>
                                    <p className="text-base sm:text-lg font-extrabold text-ink tracking-tight truncate">¿Hay materiales?</p>
                                </div>
                                <nav aria-label="Secciones" className="hidden sm:block">
                                    <ul className="flex items-center gap-1 p-1 rounded-xl bg-canvas border border-line">
                                        {PESTANAS.map(p => {
                                            const activa = activeModule === p.id;
                                            return (
                                                <li key={p.id}>
                                                    <button
                                                        type="button"
                                                        onClick={() => goTo(p.id)}
                                                        aria-current={activa ? 'page' : undefined}
                                                        className={`btn-press flex items-center gap-2 min-h-[2.25rem] px-3.5 rounded-lg text-sm font-semibold ${activa ? 'bg-surface text-ink shadow-sm border border-line-strong' : 'text-ink-soft hover:text-ink hover:bg-surface/60 border border-transparent'}`}
                                                    >
                                                        <Icon name={p.icon} className={`w-[18px] h-[18px] ${activa ? 'text-link' : 'text-muted'}`} />
                                                        {p.label}
                                                    </button>
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </nav>
                            </div>
                            <div className="flex items-center gap-3 shrink-0">
                                <span className="hidden md:inline text-sm text-muted">Hola, <b className="font-bold text-ink">{activeUser}</b></span>
                                <button type="button" onClick={handleLogout} className={`${BTN_SECUNDARIO} px-3`}>
                                    <Icon name="salir" className="w-4 h-4 text-muted" />
                                    Salir
                                </button>
                            </div>
                        </div>
                        <nav aria-label="Secciones móvil" className="sm:hidden max-w-5xl mx-auto px-4 pb-2.5">
                            <ul className="grid grid-cols-3 gap-1 p-1 rounded-xl bg-canvas border border-line">
                                {PESTANAS.map(p => {
                                    const activa = activeModule === p.id;
                                    return (
                                        <li key={p.id}>
                                            <button
                                                type="button"
                                                onClick={() => goTo(p.id)}
                                                aria-current={activa ? 'page' : undefined}
                                                className={`btn-press w-full flex items-center justify-center gap-1.5 min-h-[2.5rem] px-2 rounded-lg text-sm font-semibold ${activa ? 'bg-surface text-ink shadow-sm border border-line-strong' : 'text-ink-soft'}`}
                                            >
                                                <Icon name={p.icon} className={`w-4 h-4 ${activa ? 'text-link' : 'text-muted'}`} />
                                                {p.label}
                                            </button>
                                        </li>
                                    );
                                })}
                            </ul>
                        </nav>
                    </header>

                    <main id="contenido" ref={mainRef} className="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 pt-8 pb-28 sm:pb-12">

                        {/* ---------- LISTAS DE MATERIALES (CU-14 al CU-18) ---------- */}
                        {activeModule === 'listas' && !selectedList && (
                            <section aria-labelledby="lists-title">
                                <div className="flex flex-wrap items-end justify-between gap-4 mb-6">
                                    <div>
                                        <h1 id="lists-title" tabIndex={-1} className="focus:outline-none text-2xl font-bold text-ink tracking-tight">Listas de materiales</h1>
                                        <p className="mt-1 text-sm text-muted">Arma la lista de un trabajo y revisa si hay todo en bodega antes de empezar.</p>
                                    </div>
                                    {!showAddList && (
                                        <button id="btn-add-list" type="button" onClick={() => setShowAddList(true)} className={BTN_PRIMARIO}>
                                            <Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Nueva lista
                                        </button>
                                    )}
                                </div>

                                {showAddList && (
                                    <form onSubmit={handleCreateList} noValidate onKeyDown={(e) => e.key === 'Escape' && closeAddList()} className="panel-enter mb-6 p-4 bg-surface border border-line-strong rounded-2xl">
                                        <label htmlFor="list-name" className={ETIQUETA}>Nombre de la lista</label>
                                        <div className="flex flex-col sm:flex-row gap-3">
                                            <div className="flex-1 min-w-0">
                                                <input
                                                    id="list-name"
                                                    ref={listNameRef}
                                                    type="text"
                                                    placeholder="Ej. Mueble de baño"
                                                    value={newListName}
                                                    onChange={(e) => { setNewListName(e.target.value); setListNameError(''); }}
                                                    maxLength={60}
                                                    aria-invalid={!!listNameError}
                                                    aria-describedby={listNameError ? 'list-name-err' : undefined}
                                                    className={`${CAMPO} ${borde(listNameError)}`}
                                                />
                                                <FieldError id="list-name-err">{listNameError}</FieldError>
                                            </div>
                                            <div className="flex gap-2 self-start">
                                                <button type="button" onClick={closeAddList} className={BTN_SECUNDARIO}>Cancelar</button>
                                                <button type="submit" className={BTN_PRIMARIO}>Crear lista</button>
                                            </div>
                                        </div>
                                    </form>
                                )}

                                {lists.length > 0 ? (
                                    <ul className="bg-surface border border-line rounded-2xl divide-y divide-line">
                                        {lists.map(list => {
                                            const r = revisarLista(list, inventory);
                                            return (
                                                <li key={list.id} className="hover-row relative flex items-center gap-4 p-4">
                                                    <div className="flex-1 min-w-0">
                                                        <h2 className="text-base font-bold text-ink [overflow-wrap:anywhere]">
                                                            <button type="button" data-list-open={list.id} onClick={() => openList(list.id)} className="text-left hover:text-link focus-visible:outline-none after:absolute after:inset-0 after:rounded-[inherit] focus-visible:after:outline focus-visible:after:outline-2 focus-visible:after:outline-[var(--link)] focus-visible:after:-outline-offset-2">
                                                                {list.nombre}
                                                            </button>
                                                        </h2>
                                                        <div className="mt-1.5 flex flex-wrap items-center gap-x-2 gap-y-1">
                                                            <ResumenBadge revision={r} />
                                                            <p className="text-sm text-muted [overflow-wrap:anywhere]">
                                                                {r.filas.length === 0 ? 'Agrega materiales para revisar.'
                                                                    : r.lista ? `Hay todo en bodega (${plural(r.filas.length, 'material', 'materiales')}).`
                                                                    : textoFaltantes(r.faltantes)}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <button type="button" onClick={() => handleDeleteList(list)} className={`${BTN_PELIGRO} relative z-10 max-sm:w-10 max-sm:px-0`} aria-label={`Eliminar lista ${list.nombre}`}>
                                                        <Icon name="basura" className="w-4 h-4" /><span className="hidden sm:inline">Eliminar</span>
                                                    </button>
                                                    <span className="text-muted" aria-hidden="true"><Icon name="flechaDer" className="w-5 h-5" /></span>
                                                </li>
                                            );
                                        })}
                                    </ul>
                                ) : !showAddList && (
                                    <div className="border border-dashed border-line-strong rounded-2xl p-10 text-center">
                                        <p className="text-base font-semibold text-ink">Todavía no tienes listas</p>
                                        <p className="mt-1 text-sm text-muted">Crea una por trabajo (por ejemplo, "Mueble de cocina") y te diremos si hay todo en bodega.</p>
                                        <button type="button" onClick={() => setShowAddList(true)} className={`${BTN_PRIMARIO} mt-5`}>
                                            <Icon name="mas" className="w-4 h-4" strokeWidth={2.2} /> Crear la primera lista
                                        </button>
                                    </div>
                                )}
                            </section>
                        )}

                        {/* Detalle de una lista: la respuesta a "¿hay materiales?" */}
                        {activeModule === 'listas' && selectedList && (() => {
                            const r = revisarLista(selectedList, inventory);
                            return (
                                <section aria-labelledby="list-title">
                                    <button type="button" onClick={closeList} className={`${ENLACE} mb-3`}>
                                        <Icon name="flechaIzq" className="w-4 h-4" strokeWidth={2.2} /> Todas las listas
                                    </button>
                                    {editingListTitle ? (
                                        <form onSubmit={saveListTitle} noValidate onKeyDown={(e) => e.key === 'Escape' && cancelListTitle()} className="mb-2">
                                            <label htmlFor="edit-list-title" className="sr-only">Nombre de la lista</label>
                                            <div className="flex flex-wrap items-center gap-2">
                                                <input id="edit-list-title" type="text" autoFocus maxLength={60} value={editingListTitle.value} onChange={(e) => setEditingListTitle({ value: e.target.value, error: '' })} aria-invalid={!!editingListTitle.error} aria-describedby={editingListTitle.error ? 'edit-list-title-err' : undefined} className={`max-w-md ${CAMPO} ${borde(editingListTitle.error)} font-bold text-lg`} />
                                                <button type="submit" className={BTN_PRIMARIO}>Guardar nombre</button>
                                                <button type="button" onClick={cancelListTitle} className={BTN_SECUNDARIO}>Cancelar</button>
                                            </div>
                                            <FieldError id="edit-list-title-err">{editingListTitle.error}</FieldError>
                                        </form>
                                    ) : (
                                        <div className="flex flex-wrap items-center gap-2">
                                            <h1 id="list-title" tabIndex={-1} className="text-2xl font-bold text-ink tracking-tight [overflow-wrap:anywhere] focus:outline-none">{selectedList.nombre}</h1>
                                            <button id="btn-rename-list" type="button" onClick={() => setEditingListTitle({ value: selectedList.nombre, error: '' })} aria-label={`Cambiar nombre de la lista ${selectedList.nombre}`} className="inline-flex items-center gap-1 min-h-[2.25rem] px-2.5 rounded-lg text-xs font-semibold text-muted hover:text-ink hover:bg-surface border border-transparent hover:border-line-strong">
                                                <Icon name="lapiz" className="w-3.5 h-3.5" /> Renombrar
                                            </button>
                                        </div>
                                    )}

                                    {/* Veredicto */}
                                    <div role="status" className={`mt-4 mb-8 flex items-start gap-3 sm:gap-4 p-5 sm:p-6 rounded-2xl border ${r.filas.length === 0 ? 'bg-surface border-line' : r.lista ? 'bg-ok-soft border-[oklch(0.85_0.07_155)]' : 'bg-err-soft border-err-soft-hover'}`}>
                                        {r.filas.length === 0 ? (
                                            <>
                                                <span className="text-muted mt-0.5"><Icon name="lista" className="w-6 h-6" /></span>
                                                <div>
                                                    <p className="text-lg sm:text-xl font-bold text-ink tracking-tight">Esta lista está vacía</p>
                                                    <p className="text-sm text-ink-soft">Agrega los materiales del trabajo y cuánto necesitas de cada uno.</p>
                                                </div>
                                            </>
                                        ) : r.lista ? (
                                            <>
                                                <span className="text-ok mt-0.5"><Icon name="check" className="w-6 h-6" strokeWidth={2.4} /></span>
                                                <div>
                                                    <p className="text-lg sm:text-xl font-bold text-ok tracking-tight">Sí, hay materiales. Puedes empezar.</p>
                                                    <p className="text-sm text-ink-soft">{r.filas.length === 1 ? 'En bodega hay suficiente del único material de esta lista.' : `En bodega hay suficiente de los ${fmt(r.filas.length)} materiales de esta lista.`}</p>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                <span className="text-err-strong mt-0.5"><Icon name="alerta" className="w-6 h-6" strokeWidth={2.2} /></span>
                                                <div>
                                                    <p className="text-lg sm:text-xl font-bold text-err-strong tracking-tight">
                                                        Todavía no. {r.faltantes.length === 1 ? 'Falta 1 material' : `Faltan ${fmt(r.faltantes.length)} materiales`}.
                                                    </p>
                                                    <p className="text-sm text-ink-soft [overflow-wrap:anywhere]">
                                                        {r.faltantes.map(f => `${f.nombre} (faltan ${fmt(f.falta)})`).join(' · ')}
                                                    </p>
                                                </div>
                                            </>
                                        )}
                                    </div>

                                    {/* Agregar material con cantidad necesaria */}
                                    <form onSubmit={handleAddToList} noValidate className="mb-6">
                                        <h2 className="text-base font-bold text-ink mb-3">Agregar a la lista</h2>
                                        {disponibles.length > 0 ? (
                                            <div className="grid grid-cols-1 sm:grid-cols-[1fr_8rem_auto] gap-3 items-start">
                                                <div className="min-w-0">
                                                    <label htmlFor="list-add" className={ETIQUETA}>Material o herramienta</label>
                                                    <select
                                                        id="list-add"
                                                        value={itemToAddId}
                                                        onChange={(e) => { setItemToAddId(e.target.value); setAddErrors({ ...addErrors, item: '' }); }}
                                                        aria-invalid={!!addErrors.item}
                                                        aria-describedby={addErrors.item ? 'list-add-err' : undefined}
                                                        className={`${CAMPO} ${borde(addErrors.item)}`}
                                                    >
                                                        <option value="">Elige del inventario…</option>
                                                        {disponibles.map(inv => (
                                                            <option key={inv.id} value={inv.id}>{inv.nombre} · {inv.categoria.toLowerCase()} ({fmt(inv.cantidad)} en bodega)</option>
                                                        ))}
                                                    </select>
                                                    <FieldError id="list-add-err">{addErrors.item}</FieldError>
                                                </div>
                                                <div>
                                                    <label htmlFor="list-need" className={ETIQUETA}>Necesito</label>
                                                    <input
                                                        id="list-need"
                                                        type="number" inputMode="numeric" min="1" max={CANTIDAD_MAX} step="1" onWheel={sinRueda}
                                                        value={needQty}
                                                        onChange={(e) => { setNeedQty(e.target.value); setAddErrors({ ...addErrors, cantidad: '' }); }}
                                                        aria-invalid={!!addErrors.cantidad}
                                                        aria-describedby={addErrors.cantidad ? 'list-need-err' : undefined}
                                                        className={`${CAMPO} ${borde(addErrors.cantidad)}`}
                                                    />
                                                    <FieldError id="list-need-err">{addErrors.cantidad}</FieldError>
                                                </div>
                                                <button type="submit" className={`${BTN_PRIMARIO} sm:mt-6`}>Agregar</button>
                                            </div>
                                        ) : (
                                            <p className="text-sm text-muted">
                                                {inventory.length === 0
                                                    ? <>El inventario está vacío. <button type="button" onClick={() => { goTo('inventario'); setShowAddItem(true); }} className={ENLACE}>Registra materiales</button> para poder agregarlos.</>
                                                    : 'Ya agregaste todos los materiales del inventario a esta lista.'}
                                            </p>
                                        )}
                                    </form>

                                    {r.filas.length > 0 && (
                                        <div className="relative overflow-x-auto bg-surface border border-line rounded-2xl">
                                            <table className="w-full text-left border-collapse">
                                                <caption className="sr-only">Materiales de la lista {selectedList.nombre}: cuánto necesitas, cuánto hay y cuánto falta</caption>
                                                <thead>
                                                    <tr className="text-sm text-muted border-b border-line">
                                                        <th scope="col" className="px-4 py-3 font-semibold">Material o herramienta</th>
                                                        <th scope="col" className="px-4 py-3 font-semibold text-right">Necesito</th>
                                                        <th scope="col" className="px-4 py-3 font-semibold text-right">Hay</th>
                                                        <th scope="col" className="hidden sm:table-cell px-4 py-3 font-semibold">Estado</th>
                                                        <th scope="col" className="px-2 sm:px-4 py-3"><span className="sr-only">Acciones</span></th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-line text-sm text-ink-soft">
                                                    {r.filas.map(f => (
                                                        <React.Fragment key={f.id}>
                                                        <tr className={editingNeed && editingNeed.id === f.id && angosta ? 'border-b-0' : ''}>
                                                            <th scope="row" className="px-4 py-3 font-semibold text-ink min-w-[8rem] [overflow-wrap:anywhere]">
                                                                {f.nombre}
                                                                <span className="block text-xs font-mono text-muted mt-0.5">{f.ubicacion}</span>
                                                                <span className="sm:hidden flex flex-wrap items-center gap-2 mt-1.5">
                                                                    {f.falta > 0 ? (
                                                                        <>
                                                                            <Badge cls="bg-err-soft text-err-strong" icon="alerta">Faltan {fmt(f.falta)}</Badge>
                                                                            <button type="button" onClick={() => jumpToInventoryItem(f)} className="text-xs font-semibold text-link underline underline-offset-2">Ajustar en bodega →</button>
                                                                        </>
                                                                    ) : (
                                                                        <Badge cls="bg-ok-soft text-ok" icon="check">Alcanza</Badge>
                                                                    )}
                                                                </span>
                                                            </th>
                                                            <td className="px-2 sm:px-4 py-3 text-right whitespace-nowrap">
                                                                {editingNeed && editingNeed.id === f.id && !angosta ? (
